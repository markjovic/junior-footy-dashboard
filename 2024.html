<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EFNL U10 2024</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f1117;--s1:#161b27;--s2:#1c2235;--s3:#232a3e;
    --b1:#2a3048;--b2:#333d5c;
    --tx:#e8eaf2;--tx2:#9aa0b8;--tx3:#5a6280;
    --gold:#f0c040;--gold2:rgba(240,192,64,.12);
    --r:8px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;padding:24px 16px 60px}

  .page-hdr{max-width:960px;margin:0 auto 28px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .page-hdr h1{font-size:22px;font-weight:700;letter-spacing:-.4px}
  .badge{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1px;color:var(--gold);background:var(--gold2);border:1px solid rgba(240,192,64,.25);border-radius:4px;padding:2px 8px}
  .season{font-size:12px;color:var(--tx3);margin-left:auto;font-family:'DM Mono',monospace}

  /* Tab nav */
  .tabs{max-width:960px;margin:0 auto 20px;display:flex;gap:4px;border-bottom:1px solid var(--b1);padding-bottom:0}
  .tab-btn{padding:8px 18px;font-size:13px;font-weight:500;background:none;border:none;color:var(--tx3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;font-family:'DM Sans',sans-serif}
  .tab-btn:hover{color:var(--tx)}
  .tab-btn.on{color:var(--gold);border-bottom-color:var(--gold)}

  /* Sub-tabs (Ladder / Results) */
  .sub-tabs{display:flex;gap:2px;padding:12px 16px 0;background:var(--s2);border-bottom:1px solid var(--b1)}
  .sub-btn{padding:5px 14px;font-size:12px;font-weight:500;background:none;border:none;border-radius:var(--r) var(--r) 0 0;color:var(--tx3);cursor:pointer;transition:background .12s,color .12s;font-family:'DM Sans',sans-serif}
  .sub-btn:hover{background:var(--s3);color:var(--tx)}
  .sub-btn.on{background:var(--s1);color:var(--tx)}

  .grade-panel{display:none;max-width:960px;margin:0 auto}
  .grade-panel.on{display:block}
  .sub-panel{display:none}
  .sub-panel.on{display:block}

  .card{background:var(--s1);border:1px solid var(--b1);border-radius:0 0 var(--r) var(--r);overflow:hidden}

  /* Ladder */
  .ldr-grid{display:grid;grid-template-columns:28px 1fr 32px 32px 32px 32px 60px 60px 60px 60px 44px;align-items:center;gap:4px}
  .ldr-head{padding:6px 16px;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--tx3);border-bottom:1px solid var(--b1)}
  .ldr-head span{text-align:right}
  .ldr-head span:nth-child(2){text-align:left}
  .ldr-row{padding:8px 16px;border-top:1px solid rgba(42,48,72,.6);cursor:default;transition:background .1s}
  .ldr-row:hover{background:var(--s2)}
  .ldr-row span{text-align:right;font-family:'DM Mono',monospace;font-size:12px;color:var(--tx2)}
  .ldr-pos{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3);text-align:center!important}
  .ldr-team{font-size:13px;font-weight:500;color:var(--tx);text-align:left!important;font-family:'DM Sans',sans-serif}
  .ldr-mr{color:var(--gold)!important;font-weight:600}
  .ldr-pts{color:var(--tx)!important;font-weight:700}
  .ldr-top{background:rgba(240,192,64,.03)}
  .ldr-top .ldr-team{color:var(--tx);font-weight:600}

  /* Results */
  .round-hdr{padding:5px 16px;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--tx3);background:var(--s2);border-top:1px solid var(--b1);display:flex;align-items:center;gap:8px}
  .round-hdr:first-child{border-top:none}
  .rdate{color:var(--tx3);font-weight:400;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.3px}
  .match-row{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;padding:9px 16px;border-top:1px solid rgba(42,48,72,.5);gap:8px;transition:background .1s}
  .match-row:hover{background:var(--s2)}
  .team-home{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .team-away{display:flex;align-items:center;gap:6px}
  .tname{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tname.winner{color:var(--tx);font-weight:700}
  .tname.loser{color:var(--tx2)}
  .tname.draw{color:var(--tx2)}
  .score-box{text-align:center}
  .score-main{font-family:'DM Mono',monospace;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;line-height:1}
  .score-main .win{color:var(--gold)}
  .score-main .neu{color:var(--tx)}
  .sdash{color:var(--tx3);font-size:14px}
  .sdetail{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);margin-top:2px}
</style>
</head>

const GRADES = ['U10 Black','U10 Blue','U10 Red','U10 White'];
const COLOURS = {'U10 Black':'#94a3b8','U10 Blue':'#60a5fa','U10 Red':'#f87171','U10 White':'#e2e8f0'};

// Build tabs
const tabsEl = document.getElementById('grade-tabs');
const panelsEl = document.getElementById('grade-panels');

GRADES.forEach((grade, gi) => {
  const d = RAW[grade];
  const colour = COLOURS[grade];
  const shortName = grade.replace('U10 ','');

  // Tab button
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (gi===0?' on':'');
  btn.textContent = shortName;
  btn.style.setProperty('--tc', colour);
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('on'));
    document.querySelectorAll('.grade-panel').forEach(p=>p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('panel-'+gi).classList.add('on');
  };
  tabsEl.appendChild(btn);

  // Panel
  const panel = document.createElement('div');
  panel.className = 'grade-panel' + (gi===0?' on':'');
  panel.id = 'panel-'+gi;

  // Sub-tabs
  const maxR = Math.max(...d.matches.map(m=>m.round));
  panel.innerHTML = `
    <div class="sub-tabs">
      <button class="sub-btn on" onclick="switchSub(${gi},'ldr',this)">Ladder</button>
      <button class="sub-btn" onclick="switchSub(${gi},'res',this)">Results</button>
    </div>
    <div class="card">
      <div class="sub-panel on" id="ldr-${gi}">
        <div class="ldr-grid ldr-head">
          <span>#</span><span>Team</span><span>P</span><span>W</span><span>L</span><span>D</span>
          <span>For</span><span>Agst</span><span>MR%</span><span>PCT</span><span>Pts</span>
        </div>
        ${d.ladder.map((t,i)=>`
          <div class="ldr-grid ldr-row ${i<3?'ldr-top':''}">
            <span class="ldr-pos">${t.pos}</span>
            <span class="ldr-team">${t.name}</span>
            <span>${t.p}</span><span>${t.w}</span><span>${t.l}</span><span>${t.d}</span>
            <span style="color:var(--tx)">${t.f}</span>
            <span style="color:var(--tx)">${t.a}</span>
            <span class="ldr-mr">${t.mr.toFixed(1)}%</span>
            <span>${t.pct>=9999?'–':t.pct.toFixed(1)+'%'}</span>
            <span class="ldr-pts">${t.pts}</span>
          </div>`).join('')}
      </div>
      <div class="sub-panel" id="res-${gi}">
        ${d.rounds.map(r=>{
          const rm = d.matches.filter(m=>m.round===r);
          const date = new Date(rm[0].date).toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'});
          return `<div class="round-hdr">Round ${r} <span class="rdate">${date}</span></div>
            ${rm.map(m=>{
              const hW=m.hScore>m.aScore,aW=m.aScore>m.hScore;
              return `<div class="match-row">
                <div class="team-home"><span class="tname ${hW?'winner':aW?'loser':'draw'}">${m.home}</span></div>
                <div class="score-box">
                  <div class="score-main">
                    <span class="${hW?'win':'neu'}">${m.hScore}</span>
                    <span class="sdash">–</span>
                    <span class="${aW?'win':'neu'}">${m.aScore}</span>
                  </div>
                  <div class="sdetail">${m.hG}.${m.hB} – ${m.aG}.${m.aB}</div>
                </div>
                <div class="team-away"><span class="tname ${aW?'winner':hW?'loser':'draw'}">${m.away}</span></div>
              </div>`;
            }).join('')}`;
        }).join('')}
      </div>

});

// Style active tab with grade colour
document.querySelectorAll('.tab-btn').forEach((btn,i)=>{
  const colour = COLOURS[GRADES[i]];
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.style.color='');
    btn.style.color = colour;
    btn.style.borderBottomColor = colour;
  });
  if(i===0){ btn.style.color=COLOURS[GRADES[0]]; btn.style.borderBottomColor=COLOURS[GRADES[0]]; }
});

function switchSub(gi, which, el) {
  ['ldr','res'].forEach(s=>{
    document.getElementById(s+'-'+gi).classList.toggle('on', s===which);
  });
  el.closest('.sub-tabs').querySelectorAll('.sub-btn').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
}
