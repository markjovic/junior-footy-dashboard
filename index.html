<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Footy Dashboard</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090e">
<meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LFD">
<link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090e;--s1:#111118;--s2:#18181f;--s3:#20202a;--s4:#28283a;--b1:rgba(255,255,255,0.06);--b2:rgba(255,255,255,0.11);--b3:rgba(255,255,255,0.18);--tx:#e8e8f0;--tx2:rgba(232,232,240,0.58);--tx3:rgba(232,232,240,0.32);--gold:#f0c040;--gold2:rgba(240,192,64,0.12);--gold3:rgba(240,192,64,0.25);--green:#22c55e;--red:#ef4444;--orange:#f97316;--blue:#60a5fa;--purple:#a78bfa;--r:7px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5}
/* hidden, and it MUST stay hidden. `overflow-x:hidden` computes overflow-y to
   auto, which makes body the page's scroll container — and `.hdr` is a direct
   child of body and sticks to it. Changing this to `clip` in Beta 0.183 removed
   the scrollport the page header was sticking to, so the header scrolled away and
   left a 52px band above the club summary's sticky heading with rows visibly
   passing through it.

   Sticking to body is not the problem `clip` solves. Body SCROLLS, so anchoring
   to it is the same as anchoring to the page. The problem is an ancestor that
   creates a scrollport and then never scrolls — see .main below. */
body{overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b3);border-radius:2px}

/* ── Header ── */
.hdr{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:8px;padding:0 16px;height:52px;background:rgba(9,9,14,0.93);backdrop-filter:blur(14px);border-bottom:1px solid var(--b1);overflow:hidden}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.5px;color:var(--gold);white-space:nowrap}
.logo span{color:var(--tx2);font-weight:400}
/* age-tabs moved to sidebar */
.age-tab{font-family:'Syne',sans-serif;font-weight:600;font-size:11px;letter-spacing:1px;text-transform:uppercase;background:none;border:1px solid transparent;border-radius:var(--r);color:var(--tx3);cursor:pointer;padding:5px 12px;transition:all .15s}
.age-tab:hover{color:var(--tx2);border-color:var(--b2)}
.age-tab.on{color:var(--gold);background:var(--gold2);border-color:var(--gold3)}
.hdr-btn{font-size:11px;font-weight:500;background:none;border:1px solid var(--b2);border-radius:var(--r);color:var(--tx3);cursor:pointer;padding:5px 11px;transition:all .15s;white-space:nowrap}
.hdr-btn:hover{color:var(--tx2)}
.hdr-meta{flex-shrink:0}

/* ── Layout ── */
.layout{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 52px)}
.sidebar{border-right:1px solid var(--b1);padding:16px 12px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
/* clip, NOT hidden. This was `overflow:hidden`, which made .main a scrollport
   that never scrolls — so the club summary's sticky headings anchored to it and
   sat still, looking exactly like headings that were never sticky. `clip` is the
   one overflow value that clips without creating a scroll container, which is why
   overflow-y can stay visible here; with `hidden` the other axis is forced to
   auto. Fixed 2026-08-17. */
.main{padding:20px;overflow-x:clip;overflow-y:visible;min-width:0}

/* ── Sidebar ── */
.flabel{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--tx3);padding:0 2px;margin-bottom:4px}
/* Season state tag beside the Season label — SEASON COMPLETE / UPCOMING. Read
   from the manifest's per-season `state`, written daily by discover-seasons.js
   v4. Hidden for an active season and before the first v4 run. */
.season-state{font-family:'DM Mono',monospace;font-size:9px;font-weight:500;letter-spacing:1px;color:var(--tx2);border:1px solid var(--b2);border-radius:4px;padding:1px 6px;white-space:nowrap}
.fgroup{display:flex;flex-direction:column;gap:2px}
.fchip{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:var(--r);border:1px solid transparent;cursor:pointer;transition:all .12s;font-size:12px;color:var(--tx2);background:none;width:100%;text-align:left}
.fchip:hover{background:var(--s2);color:var(--tx)}
.fchip.on{background:var(--s2);border-color:var(--b2);color:var(--tx)}
.gdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.fsel{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);color:var(--tx);font-family:'Inter',sans-serif;font-size:12px;padding:6px 8px;width:100%;outline:none;cursor:pointer}
.fsel:focus{border-color:var(--gold3)}
.stat-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0}
.stat-row span:last-child{color:var(--gold);font-family:'DM Mono',monospace}
.player-result{display:flex;align-items:center;gap:8px;padding:6px 10px;cursor:pointer;font-size:11px;border-bottom:1px solid var(--b1);transition:background .1s}
.player-result:last-child{border-bottom:none}
.player-result:hover{background:var(--s3)}
.player-result-name{font-weight:500;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.player-result-meta{font-size:9px;color:var(--tx3);white-space:nowrap}
.freshness{display:flex;flex-direction:column;gap:3px;padding:8px 2px;border-top:1px solid var(--b1);margin-top:4px}
.freshness-row{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--tx3)}
.freshness-row span:last-child{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx2)}
.freshness-label{letter-spacing:.5px;text-transform:uppercase}

/* ── Cards ── */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--b1)}
.card-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;text-transform:uppercase}
.card-meta{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3)}

/* ── Dashboard grid ── */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.full{grid-column:1/-1}

/* ── Ladder ── */
.ldr-tabs{display:flex;gap:1px;padding:8px 10px 0;flex-wrap:wrap}
.ldr-tab{font-size:10px;font-weight:600;font-family:'DM Mono',monospace;letter-spacing:.5px;padding:4px 10px;border-radius:4px 4px 0 0;cursor:pointer;border:1px solid transparent;border-bottom:none;color:var(--tx3);background:none;transition:all .12s;white-space:nowrap}
.ldr-tab.on{border-color:var(--b2);background:var(--s2);color:var(--tx)}
.ldr-pane{display:none}
.ldr-pane.on{display:block}
.ldr-tbl{width:100%;border-collapse:collapse;font-size:11px}
.ldr-tbl th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);font-weight:500;padding:4px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--b1)}
.ldr-tbl th:nth-child(2){text-align:left}
.ldr-tbl td{padding:5px 8px;border-top:1px solid var(--b1);text-align:right;color:var(--tx2)}
.ldr-tbl td:first-child{color:var(--tx3);font-family:'DM Mono',monospace;font-size:10px}
.ldr-tbl td:nth-child(2){text-align:left}
.tname{display:flex;align-items:center;gap:6px}
.tlogo{width:18px;height:18px;border-radius:50%;object-fit:contain;background:var(--s3);flex-shrink:0}
.tnm{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.pts{color:var(--gold)!important;font-family:'DM Mono',monospace;font-weight:500!important}
.pct-col{font-family:'DM Mono',monospace;font-size:10px}
.form-wrap{display:flex;gap:2px;justify-content:flex-end}
.fb{width:14px;height:14px;border-radius:2px;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace}
.fb.W{background:rgba(34,197,94,.18);color:var(--green)}
.fb.L{background:rgba(239,68,68,.18);color:var(--red)}
.fb.D{background:rgba(249,115,22,.18);color:var(--orange)}
.fb.B{background:var(--s3);color:var(--tx3)}

/* ── GOTW ── */
.gotw-wrap{padding:14px;display:flex;flex-direction:column;gap:10px}
.gotw-teams{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gotw-team{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.gotw-logo{width:40px;height:40px;border-radius:50%;object-fit:contain;background:var(--s3)}
.gotw-name{font-size:10px;text-align:center;color:var(--tx2);line-height:1.3;word-break:break-word}
.gotw-score{text-align:center;flex-shrink:0}
.gotw-num{font-family:'Syne',sans-serif;font-weight:800;font-size:30px;line-height:1;color:var(--tx)}
.gotw-det{font-size:10px;color:var(--tx3);margin-top:3px}
.gotw-sep{color:var(--tx3);font-size:20px;margin:0 2px}
.gotw-meta{font-size:10px;color:var(--tx3);text-align:center}
.gotw-nominees{border-top:1px solid var(--b1);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.gotw-nom{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;color:var(--tx2)}
.gotw-nom-score{font-family:'DM Mono',monospace;color:var(--tx)}

/* ── Scorers ── */
.scorer-row{display:grid;grid-template-columns:20px 20px 1fr 28px 36px 32px 36px 32px;align-items:center;padding:5px 14px;gap:6px;border-top:1px solid var(--b1)}
.s-rank{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3);text-align:right}
.s-crest{display:flex;align-items:center;justify-content:center}
.s-info{min-width:0;overflow:hidden}
.s-name{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-team{font-size:9px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-g{font-family:'DM Mono',monospace;font-weight:500;color:var(--gold);font-size:13px;text-align:right}
.s-gpg{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);text-align:right}
.s-gp{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);text-align:right}
.s-bp{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx3);text-align:right}
.gtag{font-size:8px;font-weight:700;letter-spacing:.5px;padding:1px 4px;border-radius:3px;font-family:'DM Mono',monospace;flex-shrink:0}
.gtag-neutral{background:rgba(255,255,255,0.07);color:var(--tx3)}
.gtag-A,.gtag-1,.gtag-Division1{background:rgba(96,165,250,.15);color:#60a5fa}
.gtag-B,.gtag-2,.gtag-Division2{background:rgba(34,197,94,.15);color:#22c55e}
.gtag-C,.gtag-3,.gtag-Division3{background:rgba(249,115,22,.15);color:#f97316}
.gtag-D,.gtag-4,.gtag-Division4{background:rgba(167,139,250,.15);color:#a78bfa}
.gtag-D1{background:rgba(167,139,250,.15);color:#a78bfa}
.gtag-D2,.gtag-5,.gtag-Division5{background:rgba(244,114,182,.15);color:#f472b6}
.gtag-D3,.gtag-6{background:rgba(251,146,60,.15);color:#fb923c}
.gtag-D4,.gtag-7{background:rgba(232,121,249,.15);color:#e879f9}
.gtag-D5,.gtag-8{background:rgba(148,163,184,.15);color:#94a3b8}
.gtag-9{background:rgba(248,113,113,.15);color:#f87171}
.gtag-10{background:rgba(251,191,36,.15);color:#fbbf24}
.gtag-Prem{background:rgba(240,192,64,.15);color:#f0c040}
.gtag-Men{background:rgba(96,165,250,.15);color:#60a5fa}
.gtag-Women{background:rgba(244,114,182,.15);color:#f472b6}
.gtag-Grading{background:rgba(255,255,255,0.07);color:var(--tx3)}
.gtag-Blue{background:rgba(96,165,250,.15);color:#60a5fa}
.gtag-Red{background:rgba(248,113,113,.15);color:#f87171}
.gtag-Green{background:rgba(74,222,128,.15);color:#4ade80}
.gtag-Gold{background:rgba(240,192,64,.15);color:#f0c040}
.gtag-Purple{background:rgba(192,132,252,.15);color:#c084fc}
.gtag-Orange{background:rgba(251,146,60,.15);color:#fb923c}
.gtag-Navy{background:rgba(99,102,241,.15);color:#6366f1}
.gtag-Yellow{background:rgba(251,191,36,.15);color:#fbbf24}
.gtag-Pink{background:rgba(244,114,182,.15);color:#f472b6}
.gtag-Maroon{background:rgba(251,113,133,.15);color:#fb7185}
.gtag-Teal{background:rgba(45,212,191,.15);color:#2dd4bf}
.gtag-Black,.gtag-Grey,.gtag-Silver,.gtag-White{background:rgba(156,163,175,.15);color:#9ca3af}

/* ── Results ── */
.rnd-hdr{padding:6px 14px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);background:rgba(240,192,64,.04);border-top:1px solid var(--b1);display:flex;align-items:center;gap:8px}
.rnd-hdr::after{content:'';flex:1;height:1px;background:var(--b1)}
.match-row{display:grid;grid-template-columns:28px 1fr 80px 1fr minmax(160px,1fr);align-items:center;padding:6px 14px;gap:8px;border-top:1px solid var(--b1);transition:background .1s;font-size:11px}
.match-row:hover{background:var(--s2)}
.mr-left{display:flex;align-items:center;gap:6px;min-width:0}
.mr-right{display:flex;align-items:center;gap:6px;min-width:0;justify-content:flex-end}
.mr-logo{width:16px;height:16px;border-radius:50%;object-fit:contain;background:var(--s3);flex-shrink:0}
.mr-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mr-score{text-align:center;font-family:'DM Mono',monospace;font-weight:500;font-size:13px}
.mr-det{font-size:8px;color:var(--tx3);display:block;line-height:1.2;text-align:center;margin-top:1px}
.mr-venue{font-size:9px;color:var(--tx3);text-align:right;white-space:normal;line-height:1.4}
.mr-grade{display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:1px}

/* ── Empty / util ── */
.empty{padding:28px 14px;text-align:center;color:var(--tx3);font-size:12px}
.empty p{margin-top:6px}
.no-data-screen{padding:60px 20px;text-align:center;color:var(--tx3)}
.no-data-screen h2{font-family:'Syne',sans-serif;font-size:20px;color:var(--tx2);margin-bottom:8px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:500;display:flex;align-items:center;justify-content:center}
.modal{background:var(--s1);border:1px solid var(--b2);border-radius:12px;padding:24px;width:560px;max-width:96vw;max-height:92vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px}
.ml{font-size:10px;font-weight:500;color:var(--tx3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px}
.mi{background:var(--s2);border:1px solid var(--b2);border-radius:var(--r);color:var(--tx);font-family:'Inter',sans-serif;font-size:13px;padding:9px 11px;outline:none;width:100%;transition:border-color .15s}
.mi:focus{border-color:var(--gold3)}
.mi[type=file]{cursor:pointer}
.mi[type=password]{letter-spacing:2px}
.btn-p{background:var(--gold);color:#000;font-weight:700;font-size:13px;border:none;border-radius:var(--r);padding:10px 18px;cursor:pointer;font-family:'Syne',sans-serif;letter-spacing:.5px;transition:opacity .15s}
.btn-p:hover{opacity:.88}
.btn-p:disabled{opacity:.35;cursor:not-allowed}
.btn-g{background:none;border:1px solid var(--b2);color:var(--tx2);font-size:12px;border-radius:var(--r);padding:8px 14px;cursor:pointer;transition:all .15s}
.btn-g:hover{color:var(--tx);border-color:var(--b3)}
.btn-d{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5;font-size:11px;padding:4px 10px;border-radius:var(--r);cursor:pointer}
.btn-d:hover{background:rgba(239,68,68,.2)}
.mactions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.alert{padding:9px 12px;border-radius:var(--r);font-size:12px;line-height:1.5}
.alert-ok{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);color:#86efac}
.alert-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.alert-info{background:var(--gold2);border:1px solid var(--gold3);color:var(--gold)}
.utabs{display:flex;gap:2px;background:var(--s2);border-radius:var(--r);padding:2px}
.utab{flex:1;text-align:center;padding:6px 8px;border-radius:5px;font-size:11px;font-weight:500;cursor:pointer;transition:all .12s;color:var(--tx3);background:none;border:none}
.utab.on{background:var(--s1);color:var(--tx)}
.div-h{height:1px;background:var(--b1)}

/* ── Team roster table ── */
.roster-tbl{width:100%;border-collapse:collapse;font-size:12px}
.roster-tbl th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);font-weight:500;padding:4px 8px;text-align:left;border-bottom:1px solid var(--b1)}
.roster-tbl td{padding:4px 8px;border-top:1px solid var(--b1)}
.roster-tbl select{background:var(--s2);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-size:11px;padding:2px 4px}
.roster-tbl input{background:var(--s2);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-size:11px;padding:2px 6px;width:100%}

/* ── Team drilldown modal ── */
.team-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);z-index:400;display:flex;align-items:center;justify-content:center}
.team-modal{background:var(--s1);border:1px solid var(--b2);border-radius:12px;width:640px;max-width:96vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.team-modal-hdr{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--b1);flex-shrink:0}
.team-modal-title{font-family:'Syne',sans-serif;font-weight:700;font-size:16px;flex:1}
.team-modal-scroll{overflow-y:auto;flex:1;display:flex;flex-direction:column}
.team-modal-body{flex-shrink:0}
.roster-section{border-top:1px solid var(--b1);margin-top:0}
.roster-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;user-select:none;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3)}
.roster-toggle:hover{color:var(--tx2)}
.roster-toggle-arrow{font-size:12px;transition:transform .2s;color:var(--gold)}
.roster-toggle-arrow.open{transform:rotate(180deg)}
.roster-body{padding:0 16px 12px}
.roster-hdr{display:grid;grid-template-columns:1fr 36px 36px 44px 32px;gap:4px;padding:4px 0 6px;border-bottom:1px solid var(--b1);font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3)}
.roster-row{display:grid;grid-template-columns:1fr 36px 36px 44px 32px;gap:4px;padding:5px 0;border-top:1px solid var(--b1);align-items:center;font-size:11px}
.roster-name{color:var(--tx2);min-width:0;overflow:hidden}
.roster-name a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.15)}
.roster-name a:hover{color:var(--tx);border-bottom-color:var(--gold)}
.roster-stat{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2);text-align:right}
.roster-stat.goals{color:var(--gold)}
.roster-xfer{font-size:8px;font-weight:700;letter-spacing:.5px;padding:1px 3px;border-radius:3px;background:rgba(240,192,64,0.15);color:var(--gold);margin-left:4px;flex-shrink:0}
.team-stat-strip{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--b1);border-bottom:1px solid var(--b1)}
.team-stat-cell{background:var(--s1);padding:10px 12px;text-align:center}
.team-stat-val{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--gold)}

  .sidebar.open{transform:translateX(0)}

  .dgrid{grid-template-columns:1fr}
  .ldr-tbl th:nth-child(5),.ldr-tbl td:nth-child(5),

  .ldr-tbl th:nth-child(7),.ldr-tbl td:nth-child(7),

  .mr-live .live-at{display:none}

  .team-modal{width:100vw;max-width:100vw;max-height:100dvh;border-radius:0;margin:0;height:100dvh} .team-modal-scroll{flex:1;overflow-y:auto}

/* ── FINALS VIEW ── */
.fv-switch{display:inline-flex;border:1px solid var(--b1);border-radius:5px;overflow:hidden}
.fv-switch button{background:none;border:0;color:var(--tx3);font-family:'DM Mono',monospace;font-size:10px;
  letter-spacing:1px;padding:3px 10px;cursor:pointer}
.fv-switch button.on{background:rgba(240,192,64,.12);color:var(--gold)}
.fv-switch button+button{border-left:1px solid var(--b1)}
.fv-age{font-size:15px;font-weight:500;margin:18px 0 6px;display:flex;align-items:baseline;justify-content:space-between}
.fv-age .fv-meta{font-size:11px;color:var(--tx3);font-weight:400}
.fv-card{background:var(--s1);border:1px solid var(--b1);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fv-row{display:grid;gap:26px;padding:9px 0;border-bottom:1px solid var(--b1);align-items:start}
.fv-row:last-child{border-bottom:0}
.fv-hdr{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--tx3)}
.fv-cell{font-size:12px;line-height:1.55;min-width:0}
.fv-team{display:grid;grid-template-columns:minmax(0,1fr) 2.7em 3.4em;gap:7px;align-items:baseline}
.fv-tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-tscore{text-align:right;font-variant-numeric:tabular-nums}
.fv-tgb{text-align:right;font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);
  letter-spacing:.3px;font-variant-numeric:tabular-nums}
.fv-gb{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);letter-spacing:.3px}
.fv-win{color:var(--tx);font-weight:600}
.fv-lose{color:var(--tx2)}
.fv-prov{color:var(--tx3);font-style:italic}
.fv-date{font-size:10px;color:var(--tx3);font-family:'DM Mono',monospace;margin-top:3px}
.fv-out{font-size:9px;color:#ef4444;letter-spacing:.5px;text-transform:uppercase}
.fv-pos{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx2);
  border:1px solid var(--b2);border-radius:4px;padding:1px 4px;white-space:nowrap}
.fv-pos-1{color:var(--gold);border-color:rgba(240,192,64,.35)}
.fv-pos-none{color:var(--tx3);border-color:transparent;padding-left:0}
.fv-extra-hdr{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;color:var(--tx3);padding:10px 0 4px;border-top:1px solid var(--b1);
  margin-top:4px}
.fv-extra-name{font-size:12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;display:block}
/* ── Finals: club summary table ── */
.fv-sum-wrap{background:var(--s1);border:1px solid var(--b1);border-radius:10px;
  padding:2px 12px 4px;margin-bottom:14px}
/* NO overflow here on desktop, deliberately. `overflow-x:auto` computes
   overflow-y to auto as well, which makes this element a scroll container — and a
   sticky child then anchors to IT rather than to the page. The container's height
   is its content, so it never scrolls vertically and the header sits still at the
   top of the box looking exactly like a header that is not sticky at all. The
   horizontal scroll is restored under the mobile query below, where the table
   genuinely does not fit and the box is short enough that sticking matters less. */
.fv-sum-body{padding-bottom:6px}
.fv-sum{width:100%;border-collapse:collapse;font-size:12px}
/* STICKY COLUMN HEADINGS.

   top comes from --sticky-top, which syncStickyTop() keeps equal to the BOTTOM
   EDGE of .hdr on every frame that scrolls. It is not a constant 52px, because
   .hdr does not stay put: its containing block is body, body is height:100%, and
   a sticky element cannot leave its containing block — so the page header
   releases after roughly one viewport and scrolls away. With a fixed 52px the
   column headings then hung 52px down the page with club rows passing above
   them. Tracking the header's actual bottom edge means they sit under it while it
   is there and rise to the very top once it is gone, following it continuously
   rather than snapping.

   The fallback of 52px is the header's height, so the headings are in the right
   place on the first paint, before any scroll event has fired.

   It stops on its own at the bottom of the box, with no height measurement: a
   sticky element cannot leave its containing block, and thead's is the table. So
   scrolling past the summary takes the headings with it, which is what is wanted.

   The background must be opaque or the rows show through as they pass beneath.
   z-index sits below .hdr's 200 so the page header still wins while it is up. */
.fv-sum th{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;text-transform:uppercase;
  color:var(--tx3);font-weight:500;padding:8px 8px 6px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--b1);position:sticky;top:var(--sticky-top,52px);z-index:3;
  background:var(--s1)}
.fv-sum td{padding:6px 8px;border-top:1px solid var(--b1);text-align:right;color:var(--tx2);
  font-variant-numeric:tabular-nums}
.fv-sum tbody tr:hover{background:var(--s2)}
.fv-sum tfoot td{border-top:1px solid var(--b2);color:var(--tx3);font-family:'DM Mono',monospace;
  font-size:11px}
.fv-sum-club{display:flex;align-items:center;gap:7px;min-width:0}
.fv-sum-club span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-sum-rank{width:2.4em;text-align:right;font-family:'DM Mono',monospace;
  font-size:11px;color:var(--tx3);padding-right:4px !important}
.fv-sum-rank-tied{opacity:.45}
.fv-sum-zero{color:var(--tx3)}
.fv-sum-prem{color:var(--gold);font-weight:600}
@media(max-width:768px){
  .fv-sum th,.fv-sum td{padding:6px 5px}
  .fv-sum th{font-size:8px;letter-spacing:.5px}
  /* Seven columns do not fit a phone, so the horizontal scroll comes back — and
     with it the sticky headings stop sticking, because this element becomes the
     scroll container. A readable table that does not stick beats a sticking one
     with three columns off the side. */
  .fv-sum-body{overflow-x:auto}
  .fv-sum th{position:static}
}
/* IN THE HEADER, not a row of its own. A separate strip pushed the stats, the
   game list and everything below it down the panel, and duplicated the year badge
   that already sat beside the close button — so the same information appeared
   twice and cost a row. It now wraps to a second line inside the header when a
   player has more seasons than fit, which grows the header only for the players
   who need it. */
/* TRANSIENT MESSAGES. position:fixed and pointer-events:none so it is painted
   over the page rather than inserted into it — nothing reflows when it appears or
   goes, which was the explicit requirement. Sits under .hdr's z-index so it never
   covers the header controls. */
#toast-host{position:fixed;top:52px;left:0;right:0;z-index:180;display:flex;
  flex-direction:column;align-items:center;gap:5px;pointer-events:none;padding-top:8px}
.toast{pointer-events:none;font-size:11px;padding:6px 13px;border-radius:5px;
  background:var(--s3);border:1px solid var(--b2);color:var(--tx2);
  box-shadow:0 3px 14px rgba(0,0,0,.45);opacity:0;transform:translateY(-5px);
  transition:opacity .18s,transform .18s;max-width:min(90vw,460px);text-align:center}
.toast.in{opacity:1;transform:none}
.toast-ok{border-color:rgba(240,192,64,.35);color:var(--gold)}

.pm-season-strip{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;
  align-content:flex-start;flex:1;min-width:0;max-height:56px;overflow-y:auto;
  margin-right:10px;scrollbar-width:thin}
.pm-season-strip:empty{display:none}
.pm-season-strip::-webkit-scrollbar{width:4px}
.pm-season-strip::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
.pm-yr{flex-shrink:0;font-family:'DM Mono',monospace;font-size:11px;padding:3px 9px;
  border-radius:4px;cursor:pointer;border:1px solid var(--b2);background:var(--s1);
  color:var(--tx3);transition:all .12s;white-space:nowrap}
.pm-yr:hover{color:var(--tx);border-color:var(--tx3)}
.pm-yr.on{background:rgba(240,192,64,.14);border-color:rgba(240,192,64,.4);color:var(--gold);
  font-weight:500;cursor:default}
.fv-sum-hdr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:9px 2px;
  cursor:pointer;user-select:none}
.fv-sum-hdr:hover .fv-sum-title{color:var(--tx)}
.fv-sum-caret{font-size:9px;color:var(--tx3);width:10px}
.fv-sum-title{font-family:'Syne',sans-serif;font-weight:700;font-size:12px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--tx2)}
.fv-sum-sub{font-family:'DM Mono',monospace;font-size:10px;color:var(--tx3)}
.fv-sum-pct{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3)}
/* The top-grade subset, on its own line beneath the total so a cell never grows
   sideways — the table already scrolls horizontally on a phone. */
/* LIVE. A running score is not a result, and the badge is the only thing on
   screen saying so — without it a 42-46 mid-game is indistinguishable from a
   final score. The TIME matters as much as the badge: a score fetched at 14:12
   and read at 20:00 is a stale score, and showing it without saying when it was
   taken is worse than not showing it. */
.live-badge{display:inline-flex;align-items:center;gap:4px;font-family:'DM Mono',monospace;
  font-size:9px;font-weight:600;letter-spacing:.6px;padding:1px 5px;border-radius:3px;
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;
  vertical-align:middle;white-space:nowrap}
.live-dot{width:5px;height:5px;border-radius:50%;background:#ef4444;
  animation:livePulse 1.6s ease-in-out infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.live-at{font-family:'DM Mono',monospace;font-size:9px;color:var(--tx3);margin-left:4px}
/* Its OWN class, not a bare div inside .mr-score. The mobile rule hides .mr-det,
   and a badge tucked beside it was invisible on a phone — where a live score is
   most likely to be read from the sideline. Reported 2026-08-23. */
.mr-live{margin-top:2px;line-height:1}
/* QUARTER SCORES — a small aligned grid, not a run-on line.
   The first version put both teams on ONE line ("NOR 0 14 14 22 LYS 7 8 14 17"),
   so a reader could not scan DOWN a quarter to compare the two, which is the only
   reason to show quarters at all. Now: one row per team, fixed columns, so Q3 sits
   under Q3.
   Full-width and UNDER the row, never inside .mr-score — that column is 64px on a
   phone and .mr-det is display:none there. */
/* ⚠️ COLUMNS 2 TO 4, NOT 1 TO -1.
   .match-row is `28px 1fr 80px 1fr minmax(160px,1fr)` — the venue column makes it
   ASYMMETRIC, so centring across the whole row puts the strip well left of the
   score it belongs to. Spanning 2/5 brackets the score column evenly, and
   justify-self centres it there. */
.mr-qtr{grid-column:2/5;justify-self:center;margin:2px 0 1px;padding-top:4px;
  border-top:1px solid rgba(255,255,255,.06);
  display:grid;grid-template-columns:32px repeat(4,42px);
  gap:1px 4px;align-items:end;
  font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
.mr-qtr .qteam{font-size:9px;color:var(--tx3);letter-spacing:.5px;text-align:right;
  padding-right:4px;align-self:center}
/* A flex column with both numbers pushed to the same right edge. Relying on
   text-align alone let the two-decimal g.b drift against the points above it. */
.mr-qtr .qv{display:flex;flex-direction:column;align-items:flex-end;
  font-size:10px;color:var(--tx2);line-height:1.2}
.mr-qtr .qgb{font-style:normal;font-size:8px;color:var(--tx3);
  opacity:.8;line-height:1.2}
.mr-qtr .qv-der{color:var(--tx3);border-bottom:1px dotted var(--b2);cursor:help}
.mr-qtr .qv-gap{color:var(--b2)}
.qtr-off{color:#f0a020;cursor:help;font-size:10px;padding-left:4px;align-self:center}
@media(max-width:768px){
  .mr-qtr{grid-column:1/-1;justify-self:center;
    grid-template-columns:26px repeat(4,34px)}
  .mr-qtr .qgb{display:none}   /* points only — the column is too narrow for both */
}

.qtr-btn{margin-left:8px;font-family:'DM Mono',monospace;font-size:9px;

/* crest and name inside one side of a pending fixture */
.fv-side{display:inline-flex;align-items:center;gap:8px;min-width:0}
.fv-side > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fv-tag{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.5px;color:var(--tx3);
  border:1px solid var(--b1);border-radius:3px;padding:1px 5px;white-space:nowrap}
@media(max-width:768px){
  .fv-row{grid-template-columns:1fr !important}
  .fv-win-row{grid-template-columns:40px 1fr auto;row-gap:4px;gap:10px}
  /* winner keeps its own row; loser and venue drop beneath it */
  .fv-loser{grid-column:2/4}
  .fv-where{grid-column:2/4;text-align:left}
  .fv-pending{grid-column:2/4 !important}
  .fv-hdr-row{display:none !important}
  .fv-cell{border-left:2px solid var(--b1);padding-left:8px}
}
</style>
</head>
<body>

<div id="ldr-overlay"><div class="spinner"></div><span class="ldr-txt">LOCAL FOOTY DASHBOARD</span></div>

<div id="toast-host"></div>
<header class="hdr">
  <div class="logo">Local Footy <span>Dashboard</span></div>
  <span class="hdr-meta" style="font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1px;color:var(--gold);background:rgba(240,192,64,0.1);border:1px solid rgba(240,192,64,0.25);border-radius:4px;padding:2px 8px">Beta 0.226</span>
  <span id="dev-badge" style="display:none;font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:1px;color:#f97316;background:rgba(249,115,22,0.1);border:1px solid rgba(249,115,22,0.3);border-radius:4px;padding:2px 8px">DEV MODE</span>
  <button class="hdr-btn" id="filter-toggle" onclick="toggleSidebar()" style="display:none">⊟ Filters</button>
  <span class="fv-switch" id="view-switch" style="display:none">
    <button id="vsw-dash"   class="on" onclick="switchView('dash')">DASHBOARD</button>
    <button id="vsw-finals"           onclick="switchView('finals')">FINALS</button>
    <button id="vsw-leaders"          onclick="switchView('leaders')">LEADERS</button>
  </span>
  <button class="hdr-btn" id="share-btn" onclick="shareLink()"
    title="Copy a link to exactly this view">🔗 Share</button>
  <div style="flex:1"></div>
  <button class="hdr-btn" id="share-btn" onclick="shareApp()" style="display:none" title="Share">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
  </button>
  <button class="hdr-btn" id="admin-btn" onclick="openAdmin()">⚙</button>
</header>

<div id="sidebar-overlay" onclick="toggleSidebar()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;backdrop-filter:blur(2px)"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <button id="sidebar-close" onclick="toggleSidebar()">✕ Close</button>

    <div class="fgroup" id="comp-filter-group">
      <div class="flabel" style="display:flex;justify-content:space-between;align-items:center">Season<span class="season-state" id="season-state" style="display:none"></span></div>
