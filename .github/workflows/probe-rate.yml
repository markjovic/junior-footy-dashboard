# .github/workflows/probe-rate.yml
#
# What rate does publicProfileTeams actually tolerate?
#
# ⚠️ IT RAMPS CONCURRENCY UNTIL SOMETHING BLOCKS, ON PURPOSE. Serial calls are
# capped by LATENCY, not by any limit — 300 calls blocked zero times and still
# could not pass 116/min. Parallelism is the lever; StatTrack reach 940-1,340/min
# on the same backend at concurrency 25.
#
# ⚠️ RUN IT ALONE. The WAF window is shared across every run on the account, so a
# figure taken while a walk is going is lower than the truth. It holds the
# data-write group for exactly that reason.
#
# ⚠️ A BLOCK COSTS ~80 SECONDS, NOT A DAY. Recovery is 76-77s and does not
# escalate. The seven-week outage was node:https, which is fixed.
#
# ⚠️ READ-ONLY. Nothing written or committed. Worst case 1,800 calls over ~7 min.

name: Probe rate

on:
  workflow_dispatch:
    inputs:
      # ⚠️ WORKERS, NOT A RATE. Serial calls are capped by latency — 300 calls on
      # 2026-11-22 blocked zero times and still could not pass 116/min, because a
      # round trip is about 520 ms. Parallelism is the only lever.
      workers:
        description: 'workers — comma-separated concurrency ramp. 1 is the control: it is what the walk does today.'
        required: false
        default: '1,2,4,8,16,25'
        type: string
      per_stage:
        description: 'per_stage — calls at each level of concurrency.'
        required: false
        default: '150'
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Probe
        env:
          # ⚠️ AN EXPLICIT INPUT BEATS A SCRIPT DEFAULT. v2's new defaults never
          # ran because this workflow kept passing the old ones — the script was
          # changed and the workflow was not.
          PRATE_WORKERS: ${{ github.event.inputs.workers }}
          PRATE_PER_STAGE: ${{ github.event.inputs.per_stage }}
        run: |
          if [ ! -f scripts/probe-rate.js ]; then
            echo "scripts/probe-rate.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-rate.js
