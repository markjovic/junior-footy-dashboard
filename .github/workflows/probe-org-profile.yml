# .github/workflows/probe-org-profile.yml
#
# Given an organisation id, can we learn what KIND of competition it runs?
#
# ⚠️ READ-ONLY. Nothing is written or committed. A handful of calls.
#
# This is the missing fact in the transfer rule. lastInteractedOrganisation is
# tenant-scoped, so on `afl` it returns football organisations only — but it
# cannot say whether a destination is a club someone MOVED to or a spring
# competition they registered for ALONGSIDE their normal season. The season's
# length answers that, and the state says whether a move is interstate.
#
# ⚠️ IT HOLDS THE DATA-WRITE GROUP. It writes nothing but shares the call budget.

name: Probe org profile

on:
  workflow_dispatch:
    inputs:
      orgs:
        description: 'orgs — comma-separated organisation ids to profile, e.g. 70d6161b. A few of ours are always added as a control.'
        required: false
        default: ''
        type: string
      pace_ms:
        description: 'pace_ms — delay between calls. 900 is about 66/min.'
        required: false
        default: '900'
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PO_ORGS: ${{ github.event.inputs.orgs }}
          PO_PACE_MS: ${{ github.event.inputs.pace_ms }}
        run: |
          if [ ! -f scripts/probe-org-profile.js ]; then
            echo "scripts/probe-org-profile.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-org-profile.js
