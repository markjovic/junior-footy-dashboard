# .github/workflows/probe-search-by-id.yml
#
# Can lastInteractedOrganisation be reached WITHOUT a name?
#
# ⚠️ READ-ONLY. Nothing is written or committed. Around a dozen calls.
#
# We hold a uuid for all 40,382 people and a name PlayHQ may spell differently —
# measured, 4.2% do not come back under the name we hold. If the field is
# reachable by uuid, that gap closes to zero and a step disappears.
#
# ⚠️ IT HOLDS THE DATA-WRITE GROUP. It writes nothing but shares the call budget.

name: Probe search by id

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'profile — a player uuid. Blank picks one from our own data.'
        required: false
        default: ''
        type: string
      name:
        description: 'name — that player, as we hold them. Needed for the control.'
        required: false
        default: ''
        type: string
      pace_ms:
        description: 'pace_ms — delay between calls. 900 is about 66/min.'
        required: false
        default: '900'
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PI_PROFILE: ${{ github.event.inputs.profile }}
          PI_NAME: ${{ github.event.inputs.name }}
          PI_PACE_MS: ${{ github.event.inputs.pace_ms }}
        run: |
          if [ ! -f scripts/probe-search-by-id.js ]; then
            echo "scripts/probe-search-by-id.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-search-by-id.js
