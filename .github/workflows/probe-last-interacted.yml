# .github/workflows/probe-last-interacted.yml
#
# What does profileSearch's lastInteractedOrganisation actually mean?
#
# ⚠️ READ-ONLY. Nothing is written or committed. It samples players whose answer
# we ALREADY KNOW from the registrations walk and checks what the field says for
# them — a rate, not an anecdote.
#
# ⚠️ IT HOLDS THE DATA-WRITE GROUP. It writes nothing, but it shares the PlayHQ
# call budget and must not run beside a walk.

name: Probe last interacted

on:
  workflow_dispatch:
    inputs:
      sample:
        description: 'sample — players per group (movers, stayers, quiet). 40 means about 120 calls.'
        required: false
        default: '40'
        type: string
      pace_ms:
        description: 'pace_ms — delay between calls. 900 is about 66/min, inside the measured 75/min ceiling.'
        required: false
        default: '900'
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PL_SAMPLE: ${{ github.event.inputs.sample }}
          PL_PACE_MS: ${{ github.event.inputs.pace_ms }}
        run: |
          if [ ! -f scripts/probe-last-interacted.js ]; then
            echo "scripts/probe-last-interacted.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-last-interacted.js
