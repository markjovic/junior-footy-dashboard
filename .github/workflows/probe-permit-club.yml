# .github/workflows/probe-permit-club.yml
#
# Is a permit player's HOME club visible anywhere in publicProfileTeams?
#
# Norwood and Heathmont field a joint U12 side. Its Heathmont players show in
# the dashboard as Norwood departures when their permit ends, which overstates
# Norwood's net loss. This asks whether PlayHQ serves anything that tells the
# two apart.
#
# ⚠️ READ-ONLY. Nothing is written or committed. One call per named player —
# five by default, not a sweep.
#
# ⚠️ IT HOLDS THE DATA-WRITE GROUP. It writes nothing, but the WAF call budget
# is shared across every run on the account, so it must not sit beside a walk.

name: Probe permit club

on:
  workflow_dispatch:
    inputs:
      team:
        description: 'team — "<season> | <club> | <team>". Probes the WHOLE side, which is the only way to see a host-club player and a permit player together. Blank uses players below.'
        required: false
        default: ''
        type: string
      players:
        description: 'players — comma-separated names or uuids. Ignored when team is set. Blank uses the five U12 joint-team players.'
        required: false
        default: ''
        type: string
      pace_ms:
        description: 'pace_ms — delay between calls. 900 is about 66/min, inside the measured ceiling.'
        required: false
        default: '900'
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PP_TEAM: ${{ github.event.inputs.team }}
          PP_PLAYERS: ${{ github.event.inputs.players }}
          PP_PACE_MS: ${{ github.event.inputs.pace_ms }}
        run: |
          if [ ! -f scripts/probe-permit-club.js ]; then
            echo "scripts/probe-permit-club.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-permit-club.js
