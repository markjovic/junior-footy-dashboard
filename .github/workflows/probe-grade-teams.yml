# .github/workflows/probe-grade-teams.yml
#
# READ-ONLY probe. No commit, no push, no writes.
# permissions: contents:read so it cannot write even by accident.

name: Probe Grade Teams

on:
  workflow_dispatch:
    inputs:
      grade_id:
        description: 'Grade id to probe (e.g. e99a8e35). Overrides comp/age.'
        required: false
        default: ''
      comp:
        description: 'Competition filter, e.g. "EFNL 2026".'
        required: false
        default: ''
      age:
        description: 'Grade-name filter, e.g. "U18 Girls".'
        required: false
        default: ''
      rounds:
        description: 'How many rounds to sample per grade.'
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: probe-grade-teams
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/probe-grade-teams.js

      - name: Run probe
        env:
          IN_GRADE:  ${{ inputs.grade_id }}
          IN_COMP:   ${{ inputs.comp }}
          IN_AGE:    ${{ inputs.age }}
          IN_ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          # Full if-blocks, never `[ -n "$X" ] && ARGS+=(...)`: under `set -e` a
          # bare AND-list whose test fails is itself the failing statement.
          ARGS=()
          if [ -n "$IN_GRADE" ];  then ARGS+=("--grade=$IN_GRADE"); fi
          if [ -n "$IN_COMP" ];   then ARGS+=("--comp=$IN_COMP"); fi
          if [ -n "$IN_AGE" ];    then ARGS+=("--age=$IN_AGE"); fi
          if [ -n "$IN_ROUNDS" ]; then ARGS+=("--rounds=$IN_ROUNDS"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Arguments: (none)"
          else
            echo "Arguments: ${ARGS[*]}"
          fi
          node scripts/probe-grade-teams.js ${ARGS[@]+"${ARGS[@]}"} 2>&1 | tee /tmp/probe-grade-teams.txt

      - name: Confirm nothing was modified
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "PROBE MODIFIED THE WORKING TREE — this must never happen:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean. Probe wrote nothing."

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-grade-teams
          path: /tmp/probe-grade-teams.txt
          retention-days: 14
