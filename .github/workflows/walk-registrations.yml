# .github/workflows/walk-registrations.yml
name: Walk registrations

# Daily slice of the registrations walk — registrations_design.md v2. Writes
# data/registrations.json.gz and nothing else (gzip only, decided 2026-09-07). About a seventh of the cohort per
# run at 100 calls per 80 s: 5–6k calls, roughly 75 minutes.
#
# Runs in the OFF-SEASON only: the season gate inverted. When every tracked season
# is active there is nothing to learn about next season, and the run skips.
# Manual dispatch ignores the gate.
#
# Exit codes: 0 = changed, commit. 2 = nothing changed. 1 = fatal (fails the run).

on:
  workflow_dispatch:
    inputs:
      ignore_gate:
        description: 'Run even when every tracked season is active'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      # ⚠️ BOTH OF THESE EXIST TO CLEAR A BACKLOG, NOT FOR DAILY USE. Leave them
      # blank and the run behaves exactly as the schedule does.
      daily_fraction:
        description: 'daily_fraction — 7 is one seventh of the cohort (the default). 1 makes the WHOLE cohort due in one run.'
        required: false
        default: ''
        type: string
      time_budget_min:
        description: 'time_budget_min — wall clock before it stops and commits. Default 100. At 75 calls/min, 170 min is about 12,750 players.'
        required: false
        default: ''
        type: string
  schedule:
    # 19:30 UTC = 05:30 AEST, an hour after discovery (18:30 UTC) so the manifest
    # it reads is that morning's. Both hold the data-write group, so if discovery
    # is still running this waits rather than overlapping it.
    - cron: '30 19 * * *'

permissions:
  contents: write

# It writes no core.json or season file, but it takes the group anyway: the WAF
# budget is shared across every PlayHQ run on this account, and a 75-minute walk
# beside a results run would hand both of them blocks.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  walk:
    name: Walk one slice of the cohort
    runs-on: ubuntu-latest
    # ⚠️ 360 IS GITHUB'S CEILING, NOT A TARGET. The SCRIPT stops itself at
    # WALK_TIME_BUDGET_MS and commits what it has; this only stops a hung run
    # sitting there. Raised from 150 so a backlog run with a 300-minute budget is
    # not killed mid-walk — which would discard everything since the last push.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without ref a scheduled run is on a DETACHED HEAD: the commit succeeds
          # and the push never happens.
          ref: ${{ github.ref_name }}

      # ── Off-season gate ─────────────────────────────────────────────────────
      # Inverse of fetch-results.yml's Season gate: run when any tracked season
      # is complete or upcoming. A manifest with no `state` (pre discover-seasons
      # v4) is treated as in season, so this SKIPS — registrations depend on the
      # state field existing.
      - name: Off-season gate
        id: gate
        env:
          IGNORE: ${{ github.event.inputs.ignore_gate }}
        run: |
          node -e '
            const fs = require("fs");
            const core = JSON.parse(fs.readFileSync("data/core.json", "utf8"));
            const tracked = (core.manifest || []).filter(m => m.compName && m.seasonId);
            for (const m of tracked) console.log(`  ${m.compName.padEnd(14)} state=${m.state === undefined ? "(none)" : m.state}`);
            const off = tracked.filter(m => m.state === "complete" || m.state === "upcoming");
            let run = true;
            if (process.env.IGNORE === "true") console.log("ignore_gate=true — running regardless");
            else if (off.length) console.log(`OFF SEASON for: ${off.map(m => m.compName).join(", ")} — walking`);
            else { run = false; console.log("every tracked season is active (or has no state) — nothing to learn about next season; skipping"); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\n`);
          '

      - name: Walk
        id: walk
        if: steps.gate.outputs.run == 'true'
        env:
          # Blank means "use the script's default", so the scheduled run is
          # untouched by these existing at all.
          WALK_DAILY_FRACTION: ${{ github.event.inputs.daily_fraction }}
          # ⚠️ MINUTES HERE, MILLISECONDS IN THE SHELL. GitHub Actions expressions
          # have NO arithmetic operators — `* 60000` in a ${{ }} is a syntax error
          # the editor rejects outright. The conversion belongs in bash.
          BUDGET_MIN: ${{ github.event.inputs.time_budget_min }}
        run: |
          set +e
          # Only export it when a value was given, so an empty input leaves the
          # script on its own 100-minute default rather than seeing 0.
          if [ -n "$BUDGET_MIN" ]; then
            export WALK_TIME_BUDGET_MS=$(( BUDGET_MIN * 60000 ))
            echo "time budget: ${BUDGET_MIN} min (${WALK_TIME_BUDGET_MS} ms)"
          fi
          node --version
          node scripts/walk-registrations.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "Script exited 1 (fatal)."
            exit 1
          fi
          exit 0

      # ⚠️ TRANSFERS IS BUILT HERE, NOT IN ITS OWN WORKFLOW. Every push rebuilds and
      # redeploys Pages, and a separate daily job would commit a second time at the
      # same hour for no reason. Same checkout, same commit, one deploy.
      #
      # ⚠️ IT RUNS EVEN WHEN THE WALK CHANGED NOTHING (code 2). Its in-season half
      # is computed from SEASON data, which the walk never touches — so a day with
      # no registrations due can still have new transfers to find. Only a fatal
      # walk (code 1) skips it, and that already failed the step above.
      - name: Build transfers
        id: transfers
        if: steps.gate.outputs.run == 'true' && steps.walk.outputs.code != '1'
        run: |
          set +e
          if [ ! -f scripts/build-transfers.js ]; then
            echo "scripts/build-transfers.js is not in this checkout — skipping."
            exit 0
          fi
          node scripts/build-transfers.js
          code=$?
          # ⚠️ A FAILURE HERE MUST NOT DISCARD THE WALK. The walk may have just
          # spent two hours filling registrations.json.gz; losing that because a
          # derived file could not be built would be the worse outcome by far. It
          # is reported and the commit below still runs.
          if [ "$code" != "0" ]; then
            echo "::warning::build-transfers exited $code — the walk's own data is still committed below."
          fi
          exit 0

      # ⚠️ `!= '1'` NOT `== '0'`. The walk exits 2 for "nothing was due", which is a
      # normal morning once the backlog is clear — and on 2026-11-20 that was every
      # morning. With `== '0'` the commit was SKIPPED on those days, so a transfers
      # file built above would never have been pushed. The staged-diff check below
      # already stops an empty commit, so running this step on a no-change day
      # costs nothing.
      - name: Commit
        if: steps.gate.outputs.run == 'true' && steps.walk.outputs.code != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so the one-off removal of the plain registrations.json is staged too.
          #
          # ⚠️ `players/` IS STAGED HERE, AND LEAVING IT OUT COSTS A WHOLE RUN. The
          # walk sets `refetch` on a career file when it sees a season of ours that
          # file has never held (C2), and those writes land OUTSIDE data/. On
          # 2026-11-19 run #81 wrote 1,313 of them, staged none, and `git pull
          # --rebase` then refused — "cannot pull with rebase: You have unstaged
          # changes" — so a four-hour walk of 18,744 players was committed locally
          # and never pushed.
          git add -A data/registrations.json.gz data/registrations.json data/transfers.json players/ 2>/dev/null || git add -A data/ players/

          # ⚠️ NOTHING MAY BE LEFT UNSTAGED BEFORE THE REBASE. A rebase needs a
          # clean tree, and anything this job wrote but did not stage stops the
          # push dead. Catch whatever is left rather than discovering it in a log.
          if ! git diff --quiet; then
            echo "Unstaged changes remain after staging — adding them so the rebase can run:"
            git diff --name-only | sed 's/^/    /'
            git add -A
          fi

          git diff --staged --quiet || git commit -m "registrations + transfers: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push
