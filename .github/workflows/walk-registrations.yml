# .github/workflows/walk-registrations.yml
name: Walk registrations

# The registrations walk — docs/walk_pool_design.md, approved 2026-11-24.
# Writes data/registrations.json.gz, data/transfers.json and the C2 refetch
# flags under players/.
#
# ⚠️ IT SWEEPS THE WHOLE COHORT EVERY NIGHT NOW, not a seventh of it. Eight
# independent guest sessions, each paced by a minimum 800ms gap, give about
# 600 calls a minute: roughly 67 minutes for 40,382 people. v11 took about nine
# hours on one shared session paced by a token bucket, which fired in bursts at
# the round trip and ate silent 80-second WAF waits.
#
# ⚠️ THERE IS NO SEASON GATE HERE ANY MORE, AND ITS REMOVAL IS THE POINT.
# The gate skipped the job unless some tracked season was `complete` or
# `upcoming`. PlayHQ marks a season ACTIVE THE DAY REGISTRATIONS OPEN, months
# before the first game — so once every competition's next season went ACTIVE,
# this job would have stopped running entirely, through the whole registration
# window it exists to watch. On 2026-11-24 EFNL 2027 was already ACTIVE with no
# fixture until April.
#
# The script decides now, per organisation, from the GAMES in the season files:
# playing means a result in the last 21 days or a fixture in the next 21. It
# exits 2 in seconds when nothing qualifies. One place owns the rule, and it is
# the place that can read the evidence.
#
# Exit codes: 0 = changed, commit. 2 = nothing changed. 3 = DEGRADED — the walk
# hit its block ceiling, the data it did collect IS committed and then the job
# FAILS so GitHub raises it. 1 = fatal, nothing committed.

on:
  workflow_dispatch:
    inputs:
      walk_anyway:
        description: 'walk_anyway — walk every tracked organisation even one that is currently playing. Replaces the old ignore_gate.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      # ⚠️ THESE ARE THE MEASURED SAFE VALUES. Six probe runs on 2026-11-24:
      # blocked at a 270ms and a 450ms gap, clean at 662ms, 776ms and 1,490ms,
      # at both 8 and 16 sessions. 16 sessions is tested and is the sanctioned
      # ceiling for a deliberate backfill; 8 is the nightly default because it
      # sits furthest from anything that blocked.
      pool_size:
        description: 'pool_size — independent sessions. Default 8 (about 67 min). 16 is tested and halves that; do not go higher.'
        required: false
        default: ''
        type: string
      gap_ms:
        description: 'gap_ms — minimum gap between calls ON ONE SESSION. Default 800. Anything at or below 450 has blocked.'
        required: false
        default: ''
        type: string
      fraction:
        description: 'fraction — walk only 1/N of the cohort, oldest first. Default 1 (everyone). A throttle, not a schedule.'
        required: false
        default: ''
        type: string
      time_budget_min:
        description: 'time_budget_min — wall clock before it stops and commits what it has. Default 110.'
        required: false
        default: ''
        type: string
  schedule:
    # 19:30 UTC = 05:30 AEST, an hour after discovery (18:30 UTC) so the
    # manifest it reads is that morning's. Both hold the data-write group, so if
    # discovery is still running this waits rather than overlapping it.
    - cron: '30 19 * * *'

permissions:
  contents: write

# It writes no core.json or season file, but it takes the group anyway: the WAF
# budget is shared across every PlayHQ run on this account, and an hour-long
# walk beside a results run would hand both of them blocks.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  walk:
    name: Walk the cohort
    runs-on: ubuntu-latest
    # ⚠️ 360 IS GITHUB'S CEILING, NOT A TARGET. The SCRIPT stops itself at
    # WALK_TIME_BUDGET_MS and commits what it has; this only stops a hung run
    # sitting there.
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without ref a scheduled run is on a DETACHED HEAD: the commit
          # succeeds and the push never happens.
          ref: ${{ github.ref_name }}

      - name: Walk
        id: walk
        env:
          WALK_ANYWAY: ${{ github.event.inputs.walk_anyway }}
          # Blank means "use the script's default", so the scheduled run is
          # untouched by these existing at all.
          WALK_POOL_SIZE: ${{ github.event.inputs.pool_size }}
          WALK_GAP_MS: ${{ github.event.inputs.gap_ms }}
          WALK_FRACTION: ${{ github.event.inputs.fraction }}
          # ⚠️ MINUTES HERE, MILLISECONDS IN THE SHELL. GitHub Actions
          # expressions have NO arithmetic operators — `* 60000` in a ${{ }} is
          # a syntax error the editor rejects outright. The conversion belongs
          # in bash.
          BUDGET_MIN: ${{ github.event.inputs.time_budget_min }}
        run: |
          set +e
          # Only export it when a value was given, so an empty input leaves the
          # script on its own default rather than seeing 0.
          if [ -n "$BUDGET_MIN" ]; then
            export WALK_TIME_BUDGET_MS=$(( BUDGET_MIN * 60000 ))
            echo "time budget: ${BUDGET_MIN} min (${WALK_TIME_BUDGET_MS} ms)"
          fi
          node --version
          node scripts/walk-registrations.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "Script exited 1 (fatal) — nothing will be committed."
            exit 1
          fi
          exit 0

      # ⚠️ TRANSFERS IS BUILT HERE, NOT IN ITS OWN WORKFLOW. Every push rebuilds
      # and redeploys Pages, and a separate daily job would commit a second time
      # at the same hour for no reason. Same checkout, same commit, one deploy.
      #
      # ⚠️ IT RUNS EVEN WHEN THE WALK CHANGED NOTHING (code 2) AND WHEN THE WALK
      # WAS DEGRADED (code 3). Its in-season half is computed from SEASON data,
      # which the walk never touches, and a degraded walk still collected real
      # registrations. Only a fatal walk skips it, and that already failed above.
      - name: Build transfers
        id: transfers
        if: steps.walk.outputs.code != '1'
        run: |
          set +e
          if [ ! -f scripts/build-transfers.js ]; then
            echo "scripts/build-transfers.js is not in this checkout — skipping."
            exit 0
          fi
          node scripts/build-transfers.js
          code=$?
          # ⚠️ A FAILURE HERE MUST NOT DISCARD THE WALK. The walk may have just
          # spent an hour filling registrations.json.gz; losing that because a
          # derived file could not be built would be the worse outcome by far.
          if [ "$code" != "0" ]; then
            echo "::warning::build-transfers exited $code — the walk's own data is still committed below."
          fi
          exit 0

      # ⚠️ `!= '1'` NOT `== '0'`. The walk exits 2 for "nothing changed" and 3
      # for "degraded but collected"; both must still commit. With `== '0'` a
      # degraded run would throw away everything it gathered.
      - name: Commit
        if: steps.walk.outputs.code != '1'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so the one-off removal of the plain registrations.json is staged too.
          #
          # ⚠️ `players/` IS STAGED HERE, AND LEAVING IT OUT COSTS A WHOLE RUN.
          # The walk sets `refetch` on a career file when it sees a season of
          # ours that file has never held (C2), and those writes land OUTSIDE
          # data/. On 2026-11-19 run #81 wrote 1,313 of them, staged none, and
          # `git pull --rebase` then refused — "cannot pull with rebase: You
          # have unstaged changes" — so a four-hour walk of 18,744 players was
          # committed locally and never pushed.
          git add -A data/registrations.json.gz data/registrations.json data/transfers.json players/ 2>/dev/null || git add -A data/ players/

          # ⚠️ NOTHING MAY BE LEFT UNSTAGED BEFORE THE REBASE. A rebase needs a
          # clean tree, and anything this job wrote but did not stage stops the
          # push dead. Catch whatever is left rather than discovering it in a log.
          if ! git diff --quiet; then
            echo "Unstaged changes remain after staging — adding them so the rebase can run:"
            git diff --name-only | sed 's/^/    /'
            git add -A
          fi

          git diff --staged --quiet || git commit -m "registrations + transfers: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

      # ⚠️ THIS STEP EXISTS TO MAKE A DEGRADED RUN VISIBLE, AND IT MUST COME
      # AFTER THE COMMIT. Exit 3 means the walk hit its WAF block ceiling and
      # stopped early. The data it collected is real and is already pushed by
      # the step above; failing the job here is what puts a red cross in the
      # Actions list and sends the notification. Failing any earlier would have
      # skipped the commit and thrown an hour of collection away.
      - name: Fail the run if the walk was degraded
        if: steps.walk.outputs.code == '3'
        run: |
          echo "::error::The walk was DEGRADED (exit 3): it stopped after hitting its WAF block ceiling."
          echo "What it collected before stopping has been committed by the step above — nothing is lost."
          echo "Read the run log for the block list: session index, calls on that session, and timestamp."
          echo "Blocks clustered within a second across DIFFERENT sessions mean the penalty is runner-wide;"
          echo "scattered means per-cookie. Either way, widen gap_ms or lower pool_size for the next run."
          exit 1
