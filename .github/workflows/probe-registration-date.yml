# .github/workflows/probe-registration-date.yml
#
# Two open questions:
#   1. Is there a DATE on lastInteractedOrganisation? Without one, a player
#      re-signing with the SAME club is invisible — and they are the majority.
#   2. Where is the list of who registered? It must exist; `participant(id:)`
#      answers "Unauthenticated", not "no such field".
#
# ⚠️ READ-ONLY. Nothing written or committed. About 23 calls.
#
# ⚠️ IT RECORDS WHICH OPERATIONS REQUIRE A LOGIN. This pipeline is anonymous, so
# an operation answering "Unauthenticated" is simply unavailable to it. Writing
# the boundary down stops it being rediscovered.

name: Probe registration date

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'profile — a player uuid. Blank picks one whose lastOrg we already hold.'
        required: false
        default: ''
        type: string
      season:
        description: 'season — a seasonID. Blank uses the latest tracked one.'
        required: false
        default: ''
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Probe
        env:
          PD_PROFILE: ${{ github.event.inputs.profile }}
          PD_SEASON: ${{ github.event.inputs.season }}
        run: |
          if [ ! -f scripts/probe-registration-date.js ]; then
            echo "scripts/probe-registration-date.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-registration-date.js
