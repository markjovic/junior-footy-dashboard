# .github/workflows/repo-tidy.yml
#
# Removes dead files identified by repo-audit.yml.
#
# DRY RUN BY DEFAULT. The `apply` checkbox must be ticked for anything to be
# deleted, and nothing is committed unless files actually changed.
#
# Exit contract matches the other scripts:
#   0 = files removed, commit
#   2 = nothing to do, skip commit
#   1 = error

name: Repo Tidy

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'Comma separated. Blank lists the options without changing anything.'
        required: false
        default: ''
      apply:
        description: 'Actually delete. Leave unticked for a dry run.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: repo-tidy
  cancel-in-progress: false

jobs:
  tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/repo-tidy.js

      - name: Tidy
        id: tidy
        env:
          IN_GROUPS: ${{ inputs.groups }}
          # Booleans arrive as real booleans from workflow inputs, so string
          # comparison alone is not enough — test both forms.
          IN_APPLY: ${{ (inputs.apply == true || inputs.apply == 'true') && 'yes' || 'no' }}
        run: |
          ARGS=()
          if [ -n "$IN_GROUPS" ];      then ARGS+=("--groups=$IN_GROUPS"); fi
          if [ "$IN_APPLY" = "yes" ];  then ARGS+=("--apply"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Arguments: (none — will list groups and exit)"
          else
            echo "Arguments: ${ARGS[*]}"
          fi
          # Exit 2 means "nothing to do" and must not fail the step.
          set +e
          node scripts/repo-tidy.js ${ARGS[@]+"${ARGS[@]}"}
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      # ⚠️ TWO PUSHES, AND THE WORKFLOW ONE IS ALLOWED TO FAIL.
      # GitHub refuses a default-token push that touches .github/workflows/ —
      # "refusing to allow a GitHub App to create or update workflow ... without
      # `workflows` permission" — and `permissions:` cannot grant what the token
      # does not have. One commit covering both would be rejected WHOLE and land
      # nothing, including the script deletions that are perfectly allowed.
      #
      # ⚠️ THE WORKFLOW DELETIONS ARE STASHED, NOT JUST LEFT UNSTAGED. On
      # 2026-09-13 they were left in the working tree and `git pull --rebase`
      # refused with "cannot pull with rebase: You have unstaged changes" — the
      # scripts commit was made and never pushed, and the runner took it with it.
      # A rebase needs a CLEAN tree, so they are parked and brought back after.
      - name: Commit removals outside .github/workflows
        if: steps.tidy.outputs.exit_code == '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Park the workflow deletions so the tree is clean for the rebase.
          if ! git diff --quiet -- .github/workflows; then
            git stash push --quiet -- .github/workflows
            echo "parked=1" >> $GITHUB_ENV
            echo "Workflow deletions parked for the second push."
          fi

          git add -u -- . ':(exclude).github/workflows'
          if git diff --staged --quiet; then
            echo "Nothing outside .github/workflows changed — dry run, or nothing deleted."
            exit 0
          fi
          git diff --staged --name-status
          git commit -m "tidy: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

      - name: Commit workflow removals, if GitHub allows it
        id: wf
        continue-on-error: true
        if: steps.tidy.outputs.exit_code == '0' && env.parked == '1'
        run: |
          set -euo pipefail
          git stash pop
          git add -u -- .github/workflows
          if git diff --staged --quiet; then
            echo "No workflow files to remove."
            exit 0
          fi
          git diff --staged --name-status
          git commit -m "tidy: workflows (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

      # A failure above is EXPECTED, not a fault: the scripts are already pushed.
      - name: If the workflow push was refused
        if: ${{ always() && steps.wf.outcome == 'failure' }}
        run: |
          echo "=============================================================="
          echo "Workflow-file removals were NOT pushed. The default token cannot"
          echo "push a change under .github/workflows/."
          echo ""
          echo "Everything else is already committed and pushed. Delete these by"
          echo "hand in the GitHub web UI — two clicks each:"
          echo ""
          git status --porcelain -- .github/workflows | sed 's/^/    /' || true
          git stash list | sed 's/^/    (stashed) /' || true
          echo "==============================================================
