# .github/workflows/probe-team-roster.yml
#
# Can discoverTeams tell us WHO is in a 2027 team?
#
# ⚠️ READ-ONLY. Nothing is written or committed. A couple of dozen calls.
#
# ⚠️ IT HOLDS THE DATA-WRITE GROUP ANYWAY. It writes nothing, but it shares the
# PlayHQ call budget, and a probe burst beside a walk is how the WAF block of
# 2026-09 started.

name: Probe team roster

on:
  workflow_dispatch:
    inputs:
      season:
        description: 'season — a seasonID from the manifest. Blank uses the first next-season entry.'
        required: false
        default: ''
        type: string
      team:
        description: 'team — a teamID to probe on its own. Blank uses the first team found.'
        required: false
        default: ''
        type: string

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PR_SEASON: ${{ github.event.inputs.season }}
          PR_TEAM: ${{ github.event.inputs.team }}
        run: |
          if [ ! -f scripts/probe-team-roster.js ]; then
            echo "scripts/probe-team-roster.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/probe-team-roster.js
