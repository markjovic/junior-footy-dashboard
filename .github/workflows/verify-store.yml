# .github/workflows/verify-store.yml
#
# Runs every verification and prints ONE summary at the end, so a green or red
# run is readable without expanding five separate steps.
#
# All five run even if an earlier one fails, so a single run gives the complete
# picture rather than stopping at the first failure. The job fails at the end if
# any of them did.
#
# Touches nothing. Each verification builds its own fixture in a temp directory
# and stubs the network, so no PlayHQ call is made and data/ and config.json are
# never opened. index.html is read, never written.

name: Verify storage layer

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          for f in scripts/lib/store.js \
                   scripts/lib/results-engine.js \
                   scripts/discover-seasons.js \
                   scripts/fetch-results.js \
                   scripts/fetch-stats.js \
                   scripts/fetch-fixtures.js \
                   scripts/backfill.js \
                   scripts/migrate-grade-ids.js \
                   scripts/audit-data.js \
                   scripts/verify-discover-seasons.js \
                   scripts/verify-backfill.js \
                   scripts/verify-migrate-grade-ids.js \
                   scripts/verify-dashboard-grades.js \
                   scripts/verify-rebuild-grade-meta.js \
                   scripts/rebuild-grade-meta.js \
                   scripts/split-by-season.js \
                   scripts/verify-per-season.js \
                   scripts/verify-audit.js; do
            node --check "$f" || exit 1
            echo "  parsed $f"
          done

      - name: Run all verifications
        shell: bash
        run: |
          # Actions runs `run:` steps as `bash -e` by default, which aborted this
          # step at the first failing suite and printed no summary at all — the
          # exact failure the summary exists to prevent. Turned off explicitly so
          # every suite runs and one run gives the whole picture.
          set +e
          # verify-store.js was retired on 2026-08-12: it tested the
          # per-organisation layout — creating a missing -archive.json, rollover
          # between files — and none of those concepts exist any more.
          # verify-per-season.js covers store.js.
          SUITES="verify-discover-seasons verify-backfill \
                  verify-migrate-grade-ids verify-dashboard-grades \
                  verify-rebuild-grade-meta verify-per-season verify-audit"
          FAILED=0
          SUMMARY=""
          for s in $SUITES; do
            echo "::group::$s"
            OUT=$(node "scripts/$s.js" 2>&1)
            CODE=$?
            echo "$OUT"
            echo "::endgroup::"

            # The last line of every suite is "<name> <version>: N passed, N failed".
            LINE=$(echo "$OUT" | grep -E ': [0-9]+ passed, [0-9]+ failed' | tail -1)
            [ -z "$LINE" ] && LINE="$s: produced no summary line"
            if [ "$CODE" = "0" ]; then
              SUMMARY="${SUMMARY}PASS  ${LINE}"$'\n'
            else
              FAILED=1
              SUMMARY="${SUMMARY}FAIL  ${LINE}"$'\n'
              # The failing assertions themselves, so the summary is actionable
              # without opening the group above it. If the suite CRASHED there
              # are no assertions, so fall back to the tail of its output —
              # otherwise a crash reads as "no summary line" and nothing else.
              DETAIL=$(echo "$OUT" | grep -E '^[[:space:]]+FAIL ' | head -10)
              # Stack frames crowd out the message, so drop them first.
              [ -z "$DETAIL" ] && DETAIL=$(echo "$OUT" | grep -vE '^[[:space:]]+at ' | tail -8)
              while IFS= read -r l; do
                SUMMARY="${SUMMARY}        ${l}"$'\n'
              done <<< "$DETAIL"
            fi
          done

          echo ""
          echo "=================== SUMMARY ==================="
          printf '%s' "$SUMMARY"
          echo "==============================================="

          # Also on the run page itself, so it is visible without opening the
          # log at all. Guarded so the same script runs locally.
          if [ -n "$GITHUB_STEP_SUMMARY" ]; then
            {
              echo "### Verification summary"
              echo ""
              echo '```'
              printf '%s' "$SUMMARY"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$FAILED" != "0" ]; then
            echo "One or more verifications failed."
            exit 1
          fi
          echo "All verifications passed."
