# .github/workflows/verify-store.yml
#
# Runs every storage-layer verification. Same filename as before so it replaces
# the previous version cleanly; the display name has changed again because it now
# covers the results engine and the backfill too.
#
# Touches nothing. Each verification builds its own fixture in a temp directory
# and stubs the network, so no PlayHQ call is made and data/ and config.json are
# never opened. There is no commit step and nothing to roll back.
#
# Run this BEFORE any writer runs on changed code, and after any change to
# store.js, discover-seasons.js, results-engine.js, fetch-results.js or
# backfill.js.

name: Verify storage layer

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          for f in scripts/lib/store.js \
                   scripts/lib/results-engine.js \
                   scripts/discover-seasons.js \
                   scripts/fetch-results.js \
                   scripts/backfill.js \
                   scripts/verify-store.js \
                   scripts/verify-discover-seasons.js \
                   scripts/verify-backfill.js; do
            node --check "$f" || exit 1
            echo "  parsed $f"
          done

      # No `set +e` in any step. Unlike the fetch workflows, a failure must fail
      # the job — a verification that reports green when it failed is worse than
      # having no verification at all.
      - name: Verify store.js
        run: node scripts/verify-store.js

      - name: Verify discover-seasons.js
        run: node scripts/verify-discover-seasons.js

      - name: Verify the results engine and backfill
        run: node scripts/verify-backfill.js
