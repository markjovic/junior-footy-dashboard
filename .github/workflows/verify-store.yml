# .github/workflows/verify-store.yml
#
# Runs both storage-layer verifications. Same filename as before so it replaces
# the previous version cleanly; the display name changed because it now covers
# discover-seasons.js as well.
#
# Touches nothing. Both verifications build their own fixtures in temp
# directories and never open data/ or config.json. There is no commit step and
# nothing to roll back.
#
# Run this BEFORE any writer runs on a changed store.js or discover-seasons.js,
# and after any change to either.

name: Verify storage layer

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          node --check scripts/lib/store.js
          node --check scripts/discover-seasons.js
          node --check scripts/verify-store.js
          node --check scripts/verify-discover-seasons.js
          echo "all four files parse"

      # No `set +e` in either step. Unlike the fetch workflows, a failure must
      # fail the job — a verification that reports green when it failed is worse
      # than having no verification at all.
      - name: Verify store.js
        run: node scripts/verify-store.js

      # Runs the real discover-seasons.js as a child process with only
      # scripts/lib/playhq.js stubbed, so it makes no network calls.
      - name: Verify discover-seasons.js
        run: node scripts/verify-discover-seasons.js
