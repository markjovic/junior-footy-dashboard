# .github/workflows/verify-store.yml
#
# Runs every verification. Same filename as before so it replaces the previous
# version cleanly.
#
# Touches nothing. Each verification builds its own fixture in a temp directory
# and stubs the network, so no PlayHQ call is made and data/ and config.json are
# never opened. index.html is read, never written.

name: Verify storage layer

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: |
          for f in scripts/lib/store.js \
                   scripts/lib/results-engine.js \
                   scripts/discover-seasons.js \
                   scripts/fetch-results.js \
                   scripts/fetch-fixtures.js \
                   scripts/backfill.js \
                   scripts/migrate-grade-ids.js \
                   scripts/verify-store.js \
                   scripts/verify-discover-seasons.js \
                   scripts/verify-backfill.js \
                   scripts/verify-migrate-grade-ids.js \
                   scripts/verify-dashboard-grades.js; do
            node --check "$f" || exit 1
            echo "  parsed $f"
          done

      # No `set +e` anywhere. A failure must fail the job — a verification that
      # reports green when it failed is worse than having none.
      - name: Verify store.js
        run: node scripts/verify-store.js

      - name: Verify discover-seasons.js
        run: node scripts/verify-discover-seasons.js

      - name: Verify the results engine and backfill
        run: node scripts/verify-backfill.js

      - name: Verify the grade id migration
        run: node scripts/verify-migrate-grade-ids.js

      # Evaluates index.html's real inline script in a sandbox, so the ladder
      # grouping under test is the committed code rather than a copy.
      - name: Verify the dashboard grade grouping
        run: node scripts/verify-dashboard-grades.js
