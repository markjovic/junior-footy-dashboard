# .github/workflows/build-club-index.yml
#
# Builds data/clubs.json and the teamClub / clubs keys in data/core.json.
#
# ⚠️ REWRITTEN 2026-08-12. The previous version did `git add data.json`, naming a
# root-level file that was moved into data/ on 2026-08-11, so the commit step
# failed with exit 128 and the run's work was thrown away. That is the trap
# recorded in dashboard_context.md: never name root-level data.json, grades.json
# or clubs.json in a pathspec.
#
# This script writes data/clubs.json and data/core.json only — it never touches a
# season file — so `git add -A data/` covers it.

name: Build club index

on:
  workflow_dispatch:
    inputs:
      comp:
        description: 'Optional competition filter, e.g. "EFNL". Blank does every season.'
        required: false
        default: ''
        type: string
      refresh:
        description: 'Re-resolve every club from PlayHQ, ignoring the clubs.json cache'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/build-club-index.js

      - name: Build club index
        id: build
        run: |
          set +e
          ARGS=""
          [ -n "${{ github.event.inputs.comp }}" ] && ARGS="$ARGS --comp=${{ github.event.inputs.comp }}"
          [ "${{ github.event.inputs.refresh }}" = "true" ] && ARGS="$ARGS --refresh"
          node scripts/build-club-index.js $ARGS
          CODE=$?
          echo "exit_code=$CODE" >> $GITHUB_OUTPUT
          set -e
          # 0 = changed, 2 = no change. Anything else is a real failure.
          if [ "$CODE" != "0" ] && [ "$CODE" != "2" ]; then
            echo "build-club-index.js exited $CODE — failing the job"
            exit "$CODE"
          fi

      - name: Commit
        if: steps.build.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ only. Naming root-level data.json, grades.json or clubs.json
          # fails with exit 128 — they were moved into data/ on 2026-08-11.
          git add -A data/
          git diff --staged --quiet || git commit -m "club index: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push
