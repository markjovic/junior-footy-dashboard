# .github/workflows/discover-seasons.yml
name: Discover seasons

# Writes the `organisations` and `manifest` keys of data/core.json and commits
# them. Since discover-seasons v4 the manifest also carries each season's `state`
# (upcoming | active | complete) and `stateAt` — offseason_mode_design.md — so
# this workflow runs DAILY: a new season is known the day it appears, and a
# finished one is marked complete without anyone dispatching anything. About 30
# PlayHQ calls per run.
#
# Exit codes follow the repo convention: 0 = changed, 2 = no change, 1 = fatal.
# Unlike the older workflows, a fatal exit fails this run rather than showing
# green with no commit — dashboard_context.md records that as a known flaw, and a
# new file does not inherit it. That matters here: a failed organisation means an
# incomplete manifest, and an incomplete manifest is a wrong one.

on:
  workflow_dispatch:
  schedule:
    # 18:30 UTC = 04:30 AEST daily. Clear of the weekend results runs and of the
    # Monday 03:15 UTC player-index build. GitHub cron is best-effort and can run
    # late; nothing here depends on the exact minute.
    - cron: '30 18 * * *'

permissions:
  contents: write

# Shared with every other job that writes data/core.json or a season file. A
# writer holding a stale checkout of core.json would push the whole file back over
# whatever landed in between — two jobs did exactly that to each other on
# 2026-08-31. Queue behind them instead.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  discover:
    name: Read competitions and seasons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Without ref, a scheduled run checks out a DETACHED HEAD: the commit
          # succeeds, `git pull --rebase` fails, nothing is pushed.
          ref: ${{ github.ref_name }}

      # No actions/setup-node here. It changes the runner's outbound fingerprint
      # and PlayHQ answers every request with 403 CLOUDFRONT-BLOCK. ubuntu-latest
      # ships Node 20 already.

      - name: Discover seasons
        id: run
        run: |
          set +e
          node --version
          node scripts/discover-seasons.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "Script exited 1 (fatal)."
            exit 1
          fi
          exit 0

      - name: Commit
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "seasons: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-json
          path: data/core.json
          if-no-files-found: warn
          retention-days: 7
