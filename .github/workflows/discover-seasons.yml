# .github/workflows/discover-seasons.yml
name: Discover seasons

# Writes the `organisations` and `manifest` keys of data/core.json and commits
# them. Changes no existing behaviour: nothing reads core.json yet.
#
# Exit codes follow the repo convention: 0 = changed, 2 = no change, 1 = fatal.
# Unlike the older workflows, a fatal exit fails this run rather than showing
# green with no commit — dashboard_context.md records that as a known flaw, and a
# new file does not inherit it. That matters here: a failed organisation means an
# incomplete manifest, and an incomplete manifest is a wrong one.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discover-seasons
  cancel-in-progress: false

jobs:
  discover:
    name: Read competitions and seasons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover seasons
        id: run
        run: |
          set +e
          node scripts/discover-seasons.js
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "1" ]; then
            echo "Script exited 1 (fatal)."
            exit 1
          fi
          exit 0

      - name: Commit
        if: steps.run.outputs.code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "seasons: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-json
          path: data/core.json
          if-no-files-found: warn
          retention-days: 7
