# .github/workflows/find-players.yml
#
# Searches a list of names across every season this repo holds and reports what we
# have on each of them, plus how they connect to one target player.
#
# ⚠️ MAKES NO PlayHQ CALL. Everything is read from disk, so it shares no rate
# budget and cannot be blocked. Under a minute.
#
# EDIT THE NAME LIST FIRST: data/name-search.txt, one "Lastname, Firstname" per
# line, lines starting with # ignored. Edit it in the GitHub web UI.
#
# Leave `apply` at false the first time and read the log — it names every match,
# every ambiguity and every name that matched nobody before writing anything.

name: Find players by name

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'target — the player everyone is compared against, as "Lastname, Firstname"'
        required: false
        default: 'Jovic, Toby'
        type: string
      target_uuid:
        description: 'target_uuid — only needed when the target name matches more than one person. The log prints the candidates.'
        required: false
        default: ''
        type: string
      commit:
        description: 'commit — write the CSVs to data/reports/ and push. Leave false to read the log only.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

# NOTE: no concurrency group. It makes no PlayHQ call and writes only its own
# report directory, so queueing it behind a three-hour backfill would cost a
# minute's work an hour's wait for nothing.

jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Required on anything that commits, or the push lands on a detached HEAD.
          ref: ${{ github.ref_name }}

      - name: Configure git
        if: ${{ inputs.commit == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config pull.rebase true

      # NOTE: no actions/setup-node. The runner ships Node and this makes no
      # outbound request at all.
      - name: Find
        env:
          FP_TARGET: ${{ inputs.target }}
          FP_TARGET_UUID: ${{ inputs.target_uuid }}
          FP_COMMIT: ${{ inputs.commit }}
        run: |
          node --version
          node scripts/find-players.js

      # Anything the script wrote but had not pushed — a crash mid-write still
      # commits what reached the disk.
      - name: Commit the tail
        if: ${{ always() && inputs.commit == 'true' }}
        run: |
          git add -A data/reports/
          if git diff --staged --quiet; then
            echo "Nothing left to commit"
            exit 0
          fi
          git commit -m "name search report (run #${{ github.run_number }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
