# .github/workflows/repair-duplicate-names.yml
#
# Repairs duplicate records left by a mid-season team rename where NEITHER record
# carries a gameId — the case cleanup-rename-duplicates.js reports but refuses to
# touch, because nothing stored says which name PlayHQ serves now.
#
# It asks: fetches each affected round and keeps the record whose team names the
# API still returns, stamping it with PlayHQ's gameId so the pair cannot recur.
#
# Run cleanup-rename-duplicates.js FIRST (it handles the easier case offline),
# then this. ALWAYS dry-run and read the pairs before applying.

name: Repair Duplicate Names

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write the changes. Leave false for a dry run.'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      comp:
        description: 'Limit to one competition, e.g. "SEJ 2026". Blank = every loaded season.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # NOTE: no actions/setup-node in this job. It fetches api.playhq.com, and
      # setup-node changes the runner's outbound fingerprint, producing
      # 403 CLOUDFRONT-BLOCK on every request including session acquisition.
      # See docs/playhq_api_reference.md.
      - name: Repair
        env:
          REPAIR_APPLY: ${{ inputs.apply }}
          REPAIR_COMP: ${{ inputs.comp }}
        run: node scripts/repair-duplicate-names.js

      - name: Commit
        if: ${{ inputs.apply == 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Repair: remove stale duplicate records left by team renames"
          git pull --rebase -X theirs
          git push
