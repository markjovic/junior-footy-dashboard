# .github/workflows/probe-waf-state.yml
#
# Is PlayHQ blocking this account, this runner, or one operation?
#
# ⚠️ FIVE REQUESTS, no retries, no waiting, nothing written or committed. Under a
# minute.
#
# ⚠️ TURN OFF THE DAILY SCHEDULES FIRST. walk-registrations fires 72 requests into
# an active block on every run and discover-seasons adds more; retrying into a
# CloudFront block extends it. Measuring while they run measures them.
#
# ⚠️ IT DOES NOT USE lib/playhq.js, on purpose. That library retries, waits 80
# seconds and absorbs the block — which is what has kept this invisible. This is a
# diagnostic and must never be copied into anything that fetches.

name: Probe WAF state

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'note — echoed into the log, e.g. "2h after disabling the schedules"'
        required: false
        default: ''
        type: string

# Reads nothing from the repo and writes nothing to it.
permissions:
  contents: read

# ⚠️ NO concurrency group ON PURPOSE. The group exists to stop two jobs sharing
# the PlayHQ budget — but this job needs to be able to run WHILE deciding whether
# something else is holding the lock, and five paced requests cannot cause a block.
# If a fetch is genuinely running, do not dispatch this: the answer would be theirs.

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PW_NOTE: ${{ inputs.note }}
        run: |
          node --version
          echo "runner public IP (the thing CloudFront sees):"
          curl -s --max-time 10 https://api.ipify.org || echo "(could not determine)"
          echo
          node scripts/probe-waf-state.js
