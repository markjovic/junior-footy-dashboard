# .github/workflows/probe-concurrent-comps.yml
#
# Diagnostic only. Reads data/ and calls PlayHQ, writes nothing, commits nothing.
# contents:read is enough and there is no git step.
#
# It measures one age group in one season completely: competitions, grades,
# rounds with their RAW fields, every registry team, every game in every round,
# and what is stored against what PlayHQ has.
#
# WHY IT DUMPS EVERYTHING RATHER THAN ANSWERING A NARROW QUESTION. v1 asked four
# narrow questions and every answer was individually correct and collectively
# misleading: it missed that one side is registered twice in one grade under two
# team ids, that the Lightning Premiership round holds three games per team
# rather than one, and that round 10 of the season-long grade is a permanent
# PENDING placeholder. That placeholder stops fetchGrade()'s round walk, so four
# rounds of real results are never fetched.
#
# Defaults to SEJ 2026 U10, which is the case in OUTSTANDING_TASKS.md D1.
#
# COST. Section 5 is one fixture call per round per grade. The default age group
# is about 60 calls; PROBE_MAX_CALLS caps it. Widening PROBE_AGE to every age
# would be several hundred, so raise the cap deliberately rather than by default.

name: Probe concurrent competitions

on:
  workflow_dispatch:
    inputs:
      org:
        description: '8-character organisation code. Default 1cf85e52 (SEJ).'
        required: false
        default: '1cf85e52'
        type: string
      season:
        description: 'Season id. Default 4dfaaab5 (SEJ 2026).'
        required: false
        default: '4dfaaab5'
        type: string
      age:
        description: 'Age to focus on, e.g. U10. Empty means every age — expensive.'
        required: false
        default: 'U10'
        type: string
      max_calls:
        description: 'Cap on API calls. Default 120.'
        required: false
        default: '120'
        type: string

permissions:
  contents: read

concurrency:
  group: probe-concurrent-comps
  cancel-in-progress: false

jobs:
  probe:
    name: Measure one age group completely
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/probe-concurrent-comps.js

      - name: Run probe
        env:
          PROBE_ORG: ${{ github.event.inputs.org }}
          PROBE_SEASON: ${{ github.event.inputs.season }}
          PROBE_AGE: ${{ github.event.inputs.age }}
          PROBE_MAX_CALLS: ${{ github.event.inputs.max_calls }}
        run: node scripts/probe-concurrent-comps.js
