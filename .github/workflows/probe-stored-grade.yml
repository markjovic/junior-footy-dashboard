# .github/workflows/probe-stored-grade.yml
#
# READ-ONLY probe. Reads data.json only — no API calls, no commit, no push.
# permissions: contents:read so it cannot write even by accident.

name: Probe Stored Grade

on:
  workflow_dispatch:
    inputs:
      comp:
        description: 'Competition, e.g. "EFNL 2026".'
        required: false
        default: 'EFNL 2026'
      age:
        description: 'Exact age, e.g. "U18 Girls".'
        required: false
        default: 'U18 Girls'
      grade:
        description: 'Exact grade, e.g. "Grading". Blank = every grade in the age.'
        required: false
        default: ''
      team:
        description: 'Look up one team by exact stored name instead. Overrides the above.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: probe-stored-grade
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/probe-stored-grade.js

      - name: Run probe
        env:
          IN_COMP:  ${{ inputs.comp }}
          IN_AGE:   ${{ inputs.age }}
          IN_GRADE: ${{ inputs.grade }}
          IN_TEAM:  ${{ inputs.team }}
        run: |
          set -euo pipefail
          # Full if-blocks, never `[ -n "$X" ] && ARGS+=(...)`: under `set -e` a
          # bare AND-list whose test fails is itself the failing statement.
          # NOTE: --grade is passed even when blank, because an empty grade is a
          # real value in this data and must be distinguishable from "all grades".
          ARGS=()
          if [ -n "$IN_TEAM" ]; then
            ARGS+=("--team=$IN_TEAM")
          else
            if [ -n "$IN_COMP" ];  then ARGS+=("--comp=$IN_COMP"); fi
            if [ -n "$IN_AGE" ];   then ARGS+=("--age=$IN_AGE"); fi
            if [ -n "$IN_GRADE" ]; then ARGS+=("--grade=$IN_GRADE"); fi
          fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Arguments: (none)"
          else
            echo "Arguments: ${ARGS[*]}"
          fi
          node scripts/probe-stored-grade.js ${ARGS[@]+"${ARGS[@]}"} 2>&1 | tee /tmp/probe-stored-grade.txt

      - name: Confirm nothing was modified
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "PROBE MODIFIED THE WORKING TREE — this must never happen:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean. Probe wrote nothing."

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-stored-grade
          path: /tmp/probe-stored-grade.txt
          retention-days: 14
