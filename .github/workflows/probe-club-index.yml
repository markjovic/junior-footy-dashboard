# .github/workflows/probe-club-index.yml
#
# READ-ONLY probe. No commit, no push, no data.json write.
# permissions: contents:read so it cannot write even by accident.
#
# NOTE: actions/setup-node is deliberately absent. It changes the runner's
# outbound fingerprint and causes CloudFront 403s against api.playhq.com.
# ubuntu-latest ships with Node already.

name: Probe Club Index

on:
  workflow_dispatch:
    inputs:
      comp:
        description: 'Competition filter (substring, e.g. "EFNL 2026"). Blank = all.'
        required: false
        default: ''
      club:
        description: 'Validate one club id only (e.g. 6d405ccb). Blank = all found.'
        required: false
        default: ''
      limit:
        description: 'How many distinct club ids to validate.'
        required: false
        default: '10'
      seasons:
        description: 'How many clubs to list season history for (0 disables).'
        required: false
        default: '2'

permissions:
  contents: read

concurrency:
  group: probe-club-index
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Node version
        run: node --version

      - name: Syntax check
        run: node --check scripts/probe-club-index.js

      - name: Run probe
        env:
          IN_COMP:    ${{ inputs.comp }}
          IN_CLUB:    ${{ inputs.club }}
          IN_LIMIT:   ${{ inputs.limit }}
          IN_SEASONS: ${{ inputs.seasons }}
        run: |
          set -euo pipefail
          # Full if-blocks, never `[ -n "$X" ] && ARGS+=(...)`. Under `set -e` a
          # bare AND-list whose test fails is itself the failing statement and
          # would abort the step whenever an input is left blank.
          ARGS=()
          if [ -n "$IN_COMP" ];    then ARGS+=("--comp=$IN_COMP"); fi
          if [ -n "$IN_CLUB" ];    then ARGS+=("--club=$IN_CLUB"); fi
          if [ -n "$IN_LIMIT" ];   then ARGS+=("--limit=$IN_LIMIT"); fi
          if [ -n "$IN_SEASONS" ]; then ARGS+=("--seasons=$IN_SEASONS"); fi
          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Arguments: (none)"
          else
            echo "Arguments: ${ARGS[*]}"
          fi
          node scripts/probe-club-index.js ${ARGS[@]+"${ARGS[@]}"} 2>&1 | tee /tmp/probe-club-index.txt

      - name: Confirm nothing was modified
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "PROBE MODIFIED THE WORKING TREE — this must never happen:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean. Probe wrote nothing."

      - name: Upload probe output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-club-index-output
          path: /tmp/probe-club-index.txt
          retention-days: 14
