# .github/workflows/probe-ser-logos.yml
name: Probe SER logos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/probe-ser-logos.js

      - name: Run probe
        env:
          PHQ_USER: ${{ secrets.PHQ_USER }}
          PHQ_PASS: ${{ secrets.PHQ_PASS }}
        run: node scripts/probe-ser-logos.js
