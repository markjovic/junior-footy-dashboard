# .github/workflows/probe-fixture-watch-afl.yml
#
# READ-ONLY probe. No commit, no push, no writes. `contents: read` so it cannot
# write even by accident.
#
# Answers the four questions that decide whether markjovic/fixture-watch can be
# extended to cover footy as a configuration change, or whether its fixture layer
# has to be rebuilt for the afl tenant. See the header of the script.
#
# ⚠️ NO actions/setup-node. It calls api.playhq.com, and setup-node changes the
# runner's outbound fingerprint. Most workflows in this repo already say so.
# The runner's preinstalled Node is used instead.

name: Probe Fixture Watch (afl)

on:
  workflow_dispatch:
    inputs:
      players:
        description: 'Player api uuids, comma separated (36 chars each — the same ids used in StatTrack)'
        required: true
        type: string
      tenant:
        description: 'PlayHQ tenant'
        required: false
        default: 'afl'
        type: string
      delay_ms:
        description: 'Delay between PlayHQ calls, milliseconds'
        required: false
        default: '400'
        type: string
      grade:
        description: 'Any live afl grade id. Only needed on a re-run where both the grade field AND discoverTeamFixture were rejected — it is what proves the session is fine.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: probe-fixture-watch-afl
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node version (preinstalled — setup-node is forbidden in this job)
        run: node --version

      - name: Syntax check
        run: node --check scripts/probe-fixture-watch-afl.js

      - name: Probe
        run: |
          set -o pipefail
          PLAYERS='${{ inputs.players }}'
          TENANT='${{ inputs.tenant }}'
          DELAY='${{ inputs.delay_ms }}'
          if [ -z "$TENANT" ]; then TENANT='afl'; fi
          if [ -z "$DELAY" ]; then DELAY='400'; fi
          ARGS="--players=$PLAYERS --tenant=$TENANT --delay=$DELAY"
          GRADE='${{ inputs.grade }}'
          if [ -n "$GRADE" ]; then ARGS="$ARGS --grade=$GRADE"; fi
          echo "Running: node scripts/probe-fixture-watch-afl.js $ARGS"
          node scripts/probe-fixture-watch-afl.js $ARGS
