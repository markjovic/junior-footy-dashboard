name: Fetch PlayHQ Results & Stats

on:
  schedule:
    # Results — Saturday 2pm, 5pm, 8pm, 11pm AEST; Monday 9am, 12pm AEST
    # AEST = UTC+10, so subtract 10h for cron UTC times
    - cron: '0 4 * * 6'   # Sat 2pm AEST
    - cron: '0 7 * * 6'   # Sat 5pm AEST
    - cron: '0 10 * * 6'  # Sat 8pm AEST
    - cron: '0 13 * * 6'  # Sat 11pm AEST
    - cron: '0 23 * * 0'  # Mon 9am AEST  (Sun 23:00 UTC)
    - cron: '0 2 * * 1'   # Mon 12pm AEST (Mon 02:00 UTC)

    # Stats — Saturday 11pm, Sunday 5pm, Sunday 11pm, Monday 12pm AEST
    - cron: '30 13 * * 6'  # Sat 11:30pm AEST (offset 30min so results run first)
    - cron: '0 7 * * 0'    # Sun 5pm AEST
    - cron: '0 13 * * 0'   # Sun 11pm AEST
    - cron: '30 2 * * 1'   # Mon 12:30pm AEST (offset so results run first)

  workflow_dispatch:
    inputs:
      run_migration:
        description: 'Run grade migration before fetch? (yes/no)'
        required: false
        default: 'no'
      fetch_stats:
        description: 'Fetch player stats? (yes/no/auto)'
        required: false
        default: 'auto'

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    # Run on all results-schedule triggers and manual triggers
    # Stats-only schedules are handled in the fetch-stats job below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration (if requested)
        if: github.event.inputs.run_migration == 'yes'
        run: node scripts/migrate-grades.js

      - name: Commit migration
        if: github.event.inputs.run_migration == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json grades.json
          git diff --staged --quiet || git commit -m "migration: grade remapping $(date +'%A %-d %B %Y')"
          git push

      - name: Fetch results
        id: fetch
        run: |
          set +e
          node scripts/fetch-results.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit results
        if: steps.fetch.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json grades.json
          git diff --staged --quiet || git commit -m "results: auto-fetch $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase
          git push

  fetch-stats:
    runs-on: ubuntu-latest
    needs: fetch-results
    # Run after results on stats-schedule triggers and manual triggers
    # Determine whether to run based on which cron fired or manual input
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull latest so we get any data.json changes from fetch-results
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine if stats should run
        id: should_run
        run: |
          # Manual trigger: respect fetch_stats input (default auto = yes)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.fetch_stats }}"
            if [ "$INPUT" = "no" ]; then
              echo "run=false" >> $GITHUB_OUTPUT
            else
              echo "run=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          # Scheduled: check if this cron is a stats-schedule time
          # Stats crons fire at :30 past the hour (Sat 11:30pm, Mon 12:30pm)
          # or on Sunday (day 0)
          MINUTE=$(date -u +%M)
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat ... 7=Sun
          HOUR=$(date -u +%H)
          # Sunday runs are always stats
          if [ "$DOW" = "7" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          # Sat 13:30 UTC (11:30pm AEST) = stats
          elif [ "$DOW" = "6" ] && [ "$HOUR" = "13" ] && [ "$MINUTE" = "30" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          # Mon 02:30 UTC (12:30pm AEST) = stats
          elif [ "$DOW" = "1" ] && [ "$HOUR" = "2" ] && [ "$MINUTE" = "30" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch stats
        if: steps.should_run.outputs.run == 'true'
        id: stats
        run: |
          set +e
          node scripts/fetch-stats.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit stats
        if: steps.should_run.outputs.run == 'true' && steps.stats.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "stats: auto-fetch $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase
          git push
