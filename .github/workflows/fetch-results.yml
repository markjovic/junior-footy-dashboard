name: Fetch PlayHQ Results & Stats

on:
  schedule:
    # Results — Saturday 2pm, 5pm, 8pm, 11pm AEST; Monday 9am, 12pm AEST
    # AEST = UTC+10, so subtract 10h for cron UTC times
    - cron: '0 4 * * 6'    # Sat 2pm AEST
    - cron: '0 7 * * 6'    # Sat 5pm AEST
    - cron: '0 10 * * 6'   # Sat 8pm AEST
    - cron: '0 13 * * 6'   # Sat 11pm AEST
    - cron: '0 23 * * 0'   # Mon 9am AEST  (Sun 23:00 UTC)
    - cron: '0 2 * * 1'    # Mon 12pm AEST (Mon 02:00 UTC)

    # Stats — Saturday 11:30pm, Sunday 5pm, Sunday 11pm, Monday 12:30pm AEST
    # Offset 30min on shared times so results always runs first
    - cron: '30 13 * * 6'  # Sat 11:30pm AEST
    - cron: '0 7 * * 0'    # Sun 5pm AEST
    - cron: '0 13 * * 0'   # Sun 11pm AEST
    - cron: '30 2 * * 1'   # Mon 12:30pm AEST

  workflow_dispatch:
    inputs:
      fetch:
        description: 'What to fetch'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - results
          - stats
      run_migration:
        description: 'Run grade migration before fetch? (yes/no)'
        required: false
        default: 'no'

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run migration (if requested)
        if: github.event.inputs.run_migration == 'yes' && github.event.inputs.fetch != 'stats'
        run: node scripts/migrate-grades.js

      - name: Commit migration
        if: github.event.inputs.run_migration == 'yes' && github.event.inputs.fetch != 'stats'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json grades.json
          git diff --staged --quiet || git commit -m "migration: grade remapping $(date +'%A %-d %B %Y')"
          git push

      - name: Fetch results
        id: fetch
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.fetch != 'stats'
        run: |
          set +e
          node scripts/fetch-results.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit results
        if: >
          steps.fetch.outputs.exit_code == '0' &&
          (github.event_name != 'workflow_dispatch' || github.event.inputs.fetch != 'stats')
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json grades.json
          git diff --staged --quiet || git commit -m "results: auto-fetch $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase
          git push

  fetch-stats:
    runs-on: ubuntu-latest
    needs: fetch-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Determine if stats should run
        id: should_run
        run: |
          # Manual trigger: use the fetch input directly
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.fetch }}"
            if [ "$INPUT" = "results" ]; then
              echo "run=false" >> $GITHUB_OUTPUT
            else
              echo "run=true" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          # Scheduled: stats crons fire on Sunday (any hour) or at :30 past on Sat/Mon
          DOW=$(date -u +%u)   # 1=Mon ... 6=Sat ... 7=Sun
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          if [ "$DOW" = "7" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$DOW" = "6" ] && [ "$HOUR" = "13" ] && [ "$MINUTE" = "30" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          elif [ "$DOW" = "1" ] && [ "$HOUR" = "2" ] && [ "$MINUTE" = "30" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi

      - name: Fetch stats
        if: steps.should_run.outputs.run == 'true'
        id: stats
        run: |
          set +e
          node scripts/fetch-stats.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit stats
        if: steps.should_run.outputs.run == 'true' && steps.stats.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "stats: auto-fetch $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase
          git push
