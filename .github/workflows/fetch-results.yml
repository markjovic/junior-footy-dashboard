# .github/workflows/fetch-results.yml
name: Fetch PlayHQ Results & Stats

on:
  # Scheduling handled by Cloudflare Worker (footy-cron) — triggers workflow_dispatch
  # at the correct AEST times. No GitHub Actions schedule needed.
  workflow_dispatch:
    inputs:
      fetch:
        description: 'What to fetch'
        required: false
        default: 'both'
        type: choice
        options: [both, results, stats, fixtures]
      vip_only:
        description: 'VIP competitions only?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      fixtures_dry_run:
        description: 'fixtures_dry_run — report and write NOTHING. Use to diagnose without purging.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      fixtures_trace:
        description: 'fixtures_trace — print every record id for grades whose PlayHQ name contains this, e.g. "premier".'
        required: false
        default: ''
        type: string
      include_retired:
        description: 'Stats: also fetch retired seasons (slow — only for a Phase B backfill)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      ignore_season_gate:
        description: 'Run even when every tracked season is complete — for a late correction after the grand final.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Shared with discover-seasons.yml and enrich-games.yml: every job that writes
# data/core.json or a season file waits behind the others. store.save writes
# WHOLE files, so a writer holding a stale checkout pushes the old file back over
# whatever landed meanwhile — two jobs of THIS workflow did it to each other on
# 2026-08-31 (see fetch-fixtures below) and the fix there was to chain the jobs.
# This closes the same gap across workflows. Consequence: a dispatch that arrives
# while another run holds the group QUEUES rather than starting; GitHub keeps one
# queued run per group and drops an older queued one when a newer arrives.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  fetch-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ref on every checkout that will push — a detached HEAD commits and
          # pushes nothing. github.ref_name is the branch the dispatch ran on.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Log time and schedule context
        run: |
          echo "=== TIME DEBUG ==="
          echo "UTC:  $(date -u '+%Y-%m-%d %H:%M %Z')"
          echo "AEST: $(TZ='Australia/Melbourne' date '+%Y-%m-%d %H:%M %Z')"
          DOW=$(date -u +%u)
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          echo "UTC DOW=$DOW HOUR=$HOUR MINUTE=$MINUTE"
          echo "Expected cron match:"
          if [ "$MINUTE" = "30" ]; then
            echo "  → Stats run (:30 minute)"
          elif { [ "$DOW" = "6" ] && [ "$HOUR" = "4" ]; }; then echo "  → Sat 2pm AEST (VIP)";
          elif { [ "$DOW" = "6" ] && [ "$HOUR" = "7" ]; }; then echo "  → Sat 5pm AEST (VIP)";
          elif { [ "$DOW" = "6" ] && [ "$HOUR" = "10" ]; }; then echo "  → Sat 8pm AEST (VIP)";
          elif { [ "$DOW" = "6" ] && [ "$HOUR" = "13" ]; }; then echo "  → Sat 11pm AEST (All)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "1" ]; }; then echo "  → Sun 11am AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "2" ]; }; then echo "  → Sun 12pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "3" ]; }; then echo "  → Sun 1pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "4" ]; }; then echo "  → Sun 2pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "5" ]; }; then echo "  → Sun 3pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "6" ]; }; then echo "  → Sun 4pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "7" ]; }; then echo "  → Sun 5pm AEST (All/VIP stats)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "10" ]; }; then echo "  → Sun 8pm AEST (VIP)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "13" ]; }; then echo "  → Sun 11pm AEST (All)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "17" ]; }; then echo "  → Mon 3am AEST (All)";
          elif { [ "$DOW" = "0" ] && [ "$HOUR" = "23" ]; }; then echo "  → Mon 9am AEST (VIP)";
          elif { [ "$DOW" = "1" ] && [ "$HOUR" = "2" ]; }; then echo "  → Mon 12pm AEST (All)";
          else echo "  → NO MATCH — unexpected trigger time";
          fi
          echo "=================="

      # ── Season gate ─────────────────────────────────────────────────────────
      # offseason_mode_design.md: no ACTIVE and no UPCOMING tracked season means
      # nothing to fetch. `state` is written daily by discover-seasons.js v4. A
      # manifest with no `state` anywhere predates v4 and is treated as in season
      # — the failure that costs a few calls, not a missed weekend.
      #
      # RECONCILIATION (decided 2026-09-07): a season that flipped to complete is
      # still walked for 7 days after `stateAt`, so the Worker's normal dispatches
      # over that week are the final pass. The scripts themselves do not read
      # `state` or PlayHQ status — fetch-results walks config.json and relies on
      # the engine's per-grade month guard, fetch-stats skips `retired` only — so
      # this gate is the only thing that stops a complete season being walked.
      - name: Season gate
        id: gate
        env:
          IGNORE: ${{ github.event.inputs.ignore_season_gate }}
        run: |
          node -e '
            const fs = require("fs");
            const RECONCILE_DAYS = 7;
            const core = JSON.parse(fs.readFileSync("data/core.json", "utf8"));
            const tracked = (core.manifest || []).filter(m => m.compName && m.seasonId);
            for (const m of tracked) console.log(`  ${m.compName.padEnd(14)} state=${m.state === undefined ? "(none)" : m.state}  status=${m.status}  stateAt=${m.stateAt || "-"}`);
            const now = Date.now();
            const dayMs = 86400000;
            // stateAt is an ISO timestamp; take the date part, never new Date(string).
            const daysSince = (iso) => { const [y, mo, d] = String(iso || "").slice(0, 10).split("-").map(Number); return (y && mo && d) ? (now - Date.UTC(y, mo - 1, d)) / dayMs : Infinity; };
            const stated = tracked.filter(m => m.state !== undefined);
            const live = tracked.filter(m => m.state === "active" || m.state === "upcoming");
            const reconciling = tracked.filter(m => m.state === "complete" && daysSince(m.stateAt) < RECONCILE_DAYS);
            let inSeason = true;
            if (process.env.IGNORE === "true") console.log("ignore_season_gate=true — running regardless");
            else if (!stated.length) console.log("no manifest entry carries state (pre-v4 manifest) — treating as IN SEASON");
            else if (live.length || reconciling.length) {
              if (live.length) console.log(`IN SEASON: ${live.map(m => m.compName).join(", ")}`);
              if (reconciling.length) console.log(`RECONCILING (complete < ${RECONCILE_DAYS} days): ${reconciling.map(m => `${m.compName} since ${m.stateAt.slice(0, 10)}`).join(", ")}`);
            }
            else { inSeason = false; console.log("OFF SEASON — every tracked season is complete for " + RECONCILE_DAYS + "+ days; skipping the fetch"); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `in_season=${inSeason}\n`);
          '

      - name: Determine results mode
        id: mode
        run: |
          # All triggers come from Cloudflare Worker via workflow_dispatch
          INPUT="${{ github.event.inputs.fetch }}"
          if [ "$INPUT" = "stats" ] || [ "$INPUT" = "fixtures" ]; then
            echo "run_results=false" >> $GITHUB_OUTPUT
          else
            echo "run_results=true" >> $GITHUB_OUTPUT
          fi
          echo "vip_only=${{ github.event.inputs.vip_only }}" >> $GITHUB_OUTPUT

      - name: Fetch results
        id: fetch
        if: steps.mode.outputs.run_results == 'true' && steps.gate.outputs.in_season == 'true'
        env:
          VIP_ONLY: ${{ steps.mode.outputs.vip_only }}
        run: |
          set +e
          node scripts/fetch-results.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit results
        if: steps.mode.outputs.run_results == 'true' && steps.gate.outputs.in_season == 'true' && steps.fetch.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "results: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

  fetch-stats:
    runs-on: ubuntu-latest
    needs: fetch-results
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Season gate ─────────────────────────────────────────────────────────
      # offseason_mode_design.md: no ACTIVE and no UPCOMING tracked season means
      # nothing to fetch. `state` is written daily by discover-seasons.js v4. A
      # manifest with no `state` anywhere predates v4 and is treated as in season
      # — the failure that costs a few calls, not a missed weekend.
      #
      # RECONCILIATION (decided 2026-09-07): a season that flipped to complete is
      # still walked for 7 days after `stateAt`, so the Worker's normal dispatches
      # over that week are the final pass. The scripts themselves do not read
      # `state` or PlayHQ status — fetch-results walks config.json and relies on
      # the engine's per-grade month guard, fetch-stats skips `retired` only — so
      # this gate is the only thing that stops a complete season being walked.
      - name: Season gate
        id: gate
        env:
          IGNORE: ${{ github.event.inputs.ignore_season_gate }}
        run: |
          node -e '
            const fs = require("fs");
            const RECONCILE_DAYS = 7;
            const core = JSON.parse(fs.readFileSync("data/core.json", "utf8"));
            const tracked = (core.manifest || []).filter(m => m.compName && m.seasonId);
            for (const m of tracked) console.log(`  ${m.compName.padEnd(14)} state=${m.state === undefined ? "(none)" : m.state}  status=${m.status}  stateAt=${m.stateAt || "-"}`);
            const now = Date.now();
            const dayMs = 86400000;
            // stateAt is an ISO timestamp; take the date part, never new Date(string).
            const daysSince = (iso) => { const [y, mo, d] = String(iso || "").slice(0, 10).split("-").map(Number); return (y && mo && d) ? (now - Date.UTC(y, mo - 1, d)) / dayMs : Infinity; };
            const stated = tracked.filter(m => m.state !== undefined);
            const live = tracked.filter(m => m.state === "active" || m.state === "upcoming");
            const reconciling = tracked.filter(m => m.state === "complete" && daysSince(m.stateAt) < RECONCILE_DAYS);
            let inSeason = true;
            if (process.env.IGNORE === "true") console.log("ignore_season_gate=true — running regardless");
            else if (!stated.length) console.log("no manifest entry carries state (pre-v4 manifest) — treating as IN SEASON");
            else if (live.length || reconciling.length) {
              if (live.length) console.log(`IN SEASON: ${live.map(m => m.compName).join(", ")}`);
              if (reconciling.length) console.log(`RECONCILING (complete < ${RECONCILE_DAYS} days): ${reconciling.map(m => `${m.compName} since ${m.stateAt.slice(0, 10)}`).join(", ")}`);
            }
            else { inSeason = false; console.log("OFF SEASON — every tracked season is complete for " + RECONCILE_DAYS + "+ days; skipping the fetch"); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `in_season=${inSeason}\n`);
          '

      - name: Determine stats mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ github.event.inputs.fetch }}"
            if [ "$INPUT" = "results" ] || [ "$INPUT" = "fixtures" ]; then
              echo "run=false" >> $GITHUB_OUTPUT
            else
              echo "run=true" >> $GITHUB_OUTPUT
            fi
            echo "vip_only=${{ github.event.inputs.vip_only }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Stats runs fire when dispatched with fetch=both (from Cloudflare worker)
          # Scheduled cron runs never trigger stats directly (no :30 crons anymore)
          echo "run=false" >> $GITHUB_OUTPUT
          echo "vip_only=false" >> $GITHUB_OUTPUT
          exit 0

      - name: Fetch stats
        if: steps.mode.outputs.run == 'true' && steps.gate.outputs.in_season == 'true'
        id: stats
        env:
          VIP_ONLY: ${{ steps.mode.outputs.vip_only }}
          # Retired seasons are skipped unless this is set. grades.json holds
          # every season since the Phase A backfill, and re-fetching thirteen
          # completed ones took a stats run past three hours.
          STATS_INCLUDE_RETIRED: ${{ github.event.inputs.include_retired }}
        run: |
          set +e
          node scripts/fetch-stats.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit stats
        if: steps.mode.outputs.run == 'true' && steps.gate.outputs.in_season == 'true' && steps.stats.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "stats: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push

  fetch-fixtures:
    runs-on: ubuntu-latest
    # ⚠️ SERIALISED. This waits for fetch-stats, not just fetch-results.
    #
    # With `needs: fetch-results` alone, stats and fixtures ran in PARALLEL. Both
    # check out main at the same moment, both load the season file, both write the
    # WHOLE file back, and both commit. Whichever pushes second is holding a copy
    # loaded before the other's changes, so it silently reverts them.
    #
    # Measured 2026-08-31, run #335: commit 21de89a "fixtures" landed, then
    # 49f55ff "stats" from the same run landed on top and reverted it. The file
    # kept stats' 5499 records with 47 scheduled instead of fixtures' 5499 with
    # 30, and Premier's finals fixtures vanished. The fixtures job reported
    # success and lastFixtureFetch — a CORE key, in a different file — survived,
    # so every symptom pointed at the fetch logic instead of the commit.
    #
    # `git pull --rebase -X theirs` does not protect against this and contributes
    # to it: on a conflict it takes the upstream side and drops the local commit
    # without failing.
    #
    # The cost is wall-clock time — the two jobs no longer overlap. The benefit is
    # that a whole-file writer cannot be clobbered by another whole-file writer.
    needs: [fetch-results, fetch-stats]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          # 20, matching the other two jobs. This job alone was on 22; a version
          # difference between jobs in one workflow is a difference nobody
          # remembers choosing and everybody has to rule out.
          node-version: '20'

      # ── Season gate ─────────────────────────────────────────────────────────
      # offseason_mode_design.md: no ACTIVE and no UPCOMING tracked season means
      # nothing to fetch. `state` is written daily by discover-seasons.js v4. A
      # manifest with no `state` anywhere predates v4 and is treated as in season
      # — the failure that costs a few calls, not a missed weekend.
      #
      # RECONCILIATION (decided 2026-09-07): a season that flipped to complete is
      # still walked for 7 days after `stateAt`, so the Worker's normal dispatches
      # over that week are the final pass. The scripts themselves do not read
      # `state` or PlayHQ status — fetch-results walks config.json and relies on
      # the engine's per-grade month guard, fetch-stats skips `retired` only — so
      # this gate is the only thing that stops a complete season being walked.
      - name: Season gate
        id: gate
        env:
          IGNORE: ${{ github.event.inputs.ignore_season_gate }}
        run: |
          node -e '
            const fs = require("fs");
            const RECONCILE_DAYS = 7;
            const core = JSON.parse(fs.readFileSync("data/core.json", "utf8"));
            const tracked = (core.manifest || []).filter(m => m.compName && m.seasonId);
            for (const m of tracked) console.log(`  ${m.compName.padEnd(14)} state=${m.state === undefined ? "(none)" : m.state}  status=${m.status}  stateAt=${m.stateAt || "-"}`);
            const now = Date.now();
            const dayMs = 86400000;
            // stateAt is an ISO timestamp; take the date part, never new Date(string).
            const daysSince = (iso) => { const [y, mo, d] = String(iso || "").slice(0, 10).split("-").map(Number); return (y && mo && d) ? (now - Date.UTC(y, mo - 1, d)) / dayMs : Infinity; };
            const stated = tracked.filter(m => m.state !== undefined);
            const live = tracked.filter(m => m.state === "active" || m.state === "upcoming");
            const reconciling = tracked.filter(m => m.state === "complete" && daysSince(m.stateAt) < RECONCILE_DAYS);
            let inSeason = true;
            if (process.env.IGNORE === "true") console.log("ignore_season_gate=true — running regardless");
            else if (!stated.length) console.log("no manifest entry carries state (pre-v4 manifest) — treating as IN SEASON");
            else if (live.length || reconciling.length) {
              if (live.length) console.log(`IN SEASON: ${live.map(m => m.compName).join(", ")}`);
              if (reconciling.length) console.log(`RECONCILING (complete < ${RECONCILE_DAYS} days): ${reconciling.map(m => `${m.compName} since ${m.stateAt.slice(0, 10)}`).join(", ")}`);
            }
            else { inSeason = false; console.log("OFF SEASON — every tracked season is complete for " + RECONCILE_DAYS + "+ days; skipping the fetch"); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `in_season=${inSeason}\n`);
          '

      - name: Determine fixtures mode
        id: mode
        run: |
          # ⚠️ `both` MUST REACH THIS JOB.
          #
          # This tested `INPUT = "fixtures"` only, while the results and stats jobs
          # both treat `both` as "run me". The Cloudflare Worker dispatches
          # `fetch=both`, so results and stats ran on every scheduled trigger and
          # fixtures ran on NONE of them — lastFixtureFetch sat at 2026-08-16 for
          # fifteen days while results updated daily.
          #
          # The visible symptom was a grade whose finals started after that date
          # having no FR2, PF or GF fixtures at all, while every grade whose finals
          # started earlier did. Nothing was wrong with fetch-fixtures.js; it had
          # not been run.
          INPUT="${{ github.event.inputs.fetch }}"
          if [ "$INPUT" = "fixtures" ] || [ "$INPUT" = "both" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
          else
            echo "run=false" >> $GITHUB_OUTPUT
          fi
          echo "vip_only=${{ github.event.inputs.vip_only }}" >> $GITHUB_OUTPUT

      - name: Fetch fixtures
        if: steps.mode.outputs.run == 'true' && steps.gate.outputs.in_season == 'true'
        id: fixtures
        env:
          VIP_ONLY: ${{ steps.mode.outputs.vip_only }}
          FIXTURES_DRY_RUN: ${{ github.event.inputs.fixtures_dry_run }}
          FIXTURES_TRACE: ${{ github.event.inputs.fixtures_trace }}
        run: |
          set +e
          node scripts/fetch-fixtures.js
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          set -e

      - name: Commit fixtures
        if: steps.mode.outputs.run == 'true' && steps.gate.outputs.in_season == 'true' && steps.fixtures.outputs.exit_code == '0'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "fixtures: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push
