name: Fetch PlayHQ Results

on:
  # Run every hour on Sundays between 10am and 9pm AEST (UTC+10)
  schedule:
    - cron: '0 0 * * 0'   # 10:00 AEST
    - cron: '0 1 * * 0'   # 11:00 AEST
    - cron: '0 2 * * 0'   # 12:00 AEST
    - cron: '0 3 * * 0'   # 13:00 AEST
    - cron: '0 4 * * 0'   # 14:00 AEST
    - cron: '0 5 * * 0'   # 15:00 AEST
    - cron: '0 6 * * 0'   # 16:00 AEST
    - cron: '0 7 * * 0'   # 17:00 AEST
    - cron: '0 8 * * 0'   # 18:00 AEST
    - cron: '0 9 * * 0'   # 19:00 AEST
    - cron: '0 10 * * 0'  # 20:00 AEST
    - cron: '0 11 * * 0'  # 21:00 AEST

  workflow_dispatch:
    inputs:
      max_round:
        description: 'Maximum round number to fetch (leave blank for default 22)'
        required: false
        default: ''
      run_migration:
        description: 'Run grade migration script (yes/no) — use once after deploying updated fetch-results.js'
        required: false
        default: 'no'

permissions:
  contents: write

jobs:
  fetch-and-commit:
    name: Fetch results and update data.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Node version
        run: node --version

      # ── Migration (one-off, only when run_migration=yes) ─────────────────────
      - name: Run grade migration
        if: github.event.inputs.run_migration == 'yes'
        run: node scripts/migrate-grades.js

      # ── Fetch results ─────────────────────────────────────────────────────────
      - name: Fetch PlayHQ results
        id: fetch
        env:
          MAX_ROUND: ${{ github.event.inputs.max_round }}
          FETCH_DELAY_MS: '150'
        run: |
          node scripts/fetch-results.js
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      # ── Commit ────────────────────────────────────────────────────────────────
      - name: Commit updated data.json
        if: steps.fetch.outcome == 'success' || github.event.inputs.run_migration == 'yes'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data.json grades.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          RUN_DATE=$(TZ='Australia/Melbourne' date '+%A %-d %B %Y')
          if [ "${{ github.event.inputs.run_migration }}" = "yes" ]; then
            git commit -m "migrate: grade remapping ${RUN_DATE}"
          else
            git commit -m "results: auto-fetch ${RUN_DATE} (run #${{ github.run_number }})"
          fi
          git pull --rebase origin main
          git push

      - name: Check for script errors
        if: steps.fetch.outcome == 'failure' && github.event.inputs.run_migration != 'yes'
        run: |
          echo "::error::fetch-results.js exited with an error. Check the logs above."
          exit 1
