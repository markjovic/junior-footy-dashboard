# .github/workflows/probe-game-stats.yml
name: Probe game stats

# READ-ONLY probe for per_game_stats_design.md §3. Writes nothing and commits
# nothing. Dispatch only — there is no schedule and there should never be one.
#
# v3 measures COVERAGE. The box-score route was found by capturing the
# game-centre page's own request on 2026-09-11: it is `query game($id: ID!)` on
# the SPECTATOR endpoint, which lib/playhq.js already calls. What is unknown is
# how many games are electronically scored, because the spectator endpoint knows
# no others — and that number is the whole of whether P1 is worth building.
#
# At the defaults it makes about 40 calls on api.playhq.com to draw a stratified
# sample and about 60 on spectator.playhq.com to measure it.
#
# Paste the whole log back. The coverage tables are under `═══ ANSWERS ═══`.

on:
  workflow_dispatch:
    inputs:
      grades_per_comp:
        description: 'Grades sampled per competition. Spread across the grade list, not the first N'
        required: false
        default: '4'
      games_per_grade:
        description: 'Completed games sampled per grade'
        required: false
        default: '3'
      skip_trials:
        description: 'Skip the two main-API trials and measure coverage only'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Nothing is written, so read access is all this needs. A probe that cannot
# commit cannot damage anything it is measuring.
permissions:
  contents: read

# It writes no file at all, but it takes the data-write group for the reason
# probe-career-stats.yml does: the WAF budget is shared across every PlayHQ run
# on this account, and a probe firing beside a scheduled walk would hand both of
# them blocks. ⚠️ A dispatch arriving during the walk QUEUES rather than starting.
# ⚠️ Most of this run's calls go to the SPECTATOR host, whose limits have never
# been measured here. The group is kept anyway — it costs nothing and the two
# hosts may well share a budget.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  probe:
    name: Measure spectator box-score coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job commits nothing, so the detached-HEAD trap does not apply
          # to it. Kept so every workflow in the repo reads the same way.
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PROBE_GRADES_PER_COMP: ${{ github.event.inputs.grades_per_comp }}
          PROBE_GAMES_PER_GRADE: ${{ github.event.inputs.games_per_grade }}
          PROBE_SKIP_TRIALS: ${{ github.event.inputs.skip_trials }}
        run: |
          node --version
          node scripts/probe-game-stats.js
