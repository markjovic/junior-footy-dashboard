# .github/workflows/probe-game-stats.yml
name: Probe game stats

# READ-ONLY probe for per_game_stats_design.md §3. Writes nothing and commits
# nothing. Dispatch only — there is no schedule and there should never be one.
#
# v4 asks ONE question: where the non-zero player numbers live. v3 found the
# route, measured coverage, and then reported every count as zero for games whose
# PlayHQ page plainly shows goals — a reading defect here, not a fact about
# PlayHQ. This run asks the captured document IN FULL against twelve games
# already known to be electronically scored.
#
# TWELVE CALLS, all to spectator.playhq.com, which needs no session cookie on the
# afl tenant. It makes no main-API call at all.
#
# Paste the whole log back. The answer is under `═══ WHERE THE NUMBERS ARE ═══`.

on:
  workflow_dispatch:
    inputs:
      game_ids:
        description: 'Comma-separated game ids. Blank uses the twelve v3 found electronically scored on 2026-09-11'
        required: false
        default: ''
      max_games:
        description: 'Upper bound on how many of them to ask about'
        required: false
        default: '12'

# Nothing is written, so read access is all this needs. A probe that cannot
# commit cannot damage anything it is measuring.
permissions:
  contents: read

# It writes no file at all, but it takes the data-write group for the reason
# probe-career-stats.yml does: the WAF budget is shared across every PlayHQ run
# on this account, and a probe firing beside a scheduled walk would hand both of
# them blocks. ⚠️ A dispatch arriving during the walk QUEUES rather than starting.
# ⚠️ EVERY call in this run goes to the SPECTATOR host, whose limits have never
# been measured here. The group is kept anyway — it costs nothing and the two
# hosts may well share a budget.
concurrency:
  group: playhq-data-write
  cancel-in-progress: false

jobs:
  probe:
    name: Locate the per-player figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # This job commits nothing, so the detached-HEAD trap does not apply
          # to it. Kept so every workflow in the repo reads the same way.
          ref: ${{ github.ref_name }}

      - name: Probe
        env:
          PROBE_GAME_IDS: ${{ github.event.inputs.game_ids }}
          PROBE_MAX_GAMES: ${{ github.event.inputs.max_games }}
        run: |
          node --version
          node scripts/probe-game-stats.js
