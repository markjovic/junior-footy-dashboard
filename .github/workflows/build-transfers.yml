# .github/workflows/build-transfers.yml
#
# Builds data/transfers.json — every player who has changed club.
#
# ⚠️ MAKES NO PlayHQ CALL. It reads data already committed: the per-game lines,
# the match records, and registrations.json.gz. Minutes, not hours.
#
# ⚠️ IT WRITES data/transfers.json AND NOTHING ELSE, but it still holds the
# playhq-data-write concurrency group: store.save writes WHOLE files, so a writer
# running beside one with an overlapping checkout silently reverts it. That it
# touches different fields does not matter.

name: Build transfers

on:
  schedule:
    # 21:30 UTC = 07:30 AEST. Two hours after the walk starts (19:30 UTC), which
    # is an hour after discovery (18:30 UTC) — so the chain each morning is
    # discovery, then the walk, then this.
    #
    # ⚠️ TWO HOURS IS A HEAD START, NOT A GUARANTEE. A full walk runs 100 minutes
    # and a backlog run longer. All three hold the playhq-data-write group, so if
    # the walk is still going this QUEUES rather than overlapping it — which is
    # the point of the group, and why a late start is safe rather than a race.
    #
    # It reads the walk's output but does not depend on it being fresh: the
    # in-season half comes from season data the walk never touches, so a day when
    # the walk is still running still produces a correct file, one day behind on
    # the between-season half only.
    - cron: '30 21 * * *'

  workflow_dispatch:
    inputs:
      min_games:
        description: 'min_games — below this, a club in an in-season move is flagged as a possible fill-in (not dropped). Default 3.'
        required: false
        default: ''
        type: string
      dry_run:
        description: 'dry_run — print the numbers and write nothing. Use this first to choose min_games.'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: playhq-data-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        # ⚠️ ref IS LOAD-BEARING. Without it the commit lands on a detached head
        # and the push is discarded.
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Build
        env:
          # ⚠️ github.event.inputs IS NULL ON A SCHEDULED RUN, which resolves to an
          # empty string — exactly what the script treats as "use the default".
          # Spelling it out because a `|| 'false'` here would look safer and would
          # instead hard-code the dispatch default into every scheduled run.
          TR_MIN_GAMES: ${{ github.event.inputs.min_games }}
          TR_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          if [ ! -f scripts/build-transfers.js ]; then
            echo "scripts/build-transfers.js is not in this checkout — commit it first."
            exit 1
          fi
          node --version
          node scripts/build-transfers.js

      # ⚠️ `!= 'true'` IS THE RIGHT TEST, not `== 'false'`. On a scheduled run the
      # input is absent and compares as an empty string: `!= 'true'` is true and
      # the commit runs, which is what a cron job must do. `== 'false'` would be
      # FALSE on every scheduled run and the file would never once be committed.
      - name: Commit
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/transfers.json

          # ⚠️ NOTHING MAY BE LEFT UNSTAGED BEFORE THE REBASE. A rebase needs a
          # clean tree, and on 2026-11-19 an unstaged players/ tree cost a
          # four-hour walk its push. Catch whatever is left rather than
          # discovering it in a log.
          if ! git diff --quiet; then
            echo "Unstaged changes remain after staging — adding them so the rebase can run:"
            git diff --name-only | sed 's/^/    /'
            git add -A
          fi

          git diff --staged --quiet || git commit -m "transfers: $(date +'%A %-d %B %Y') (run #${{ github.run_number }})"
          git pull --rebase -X theirs
          git push
