# .github/workflows/probe-concurrent-comps.yml
#
# Diagnostic only. Reads data/core.json and calls PlayHQ, writes nothing, commits
# nothing. contents:read is enough and there is no git step.
#
# It answers one question before D1 is designed: how does PlayHQ represent two
# competitions running in the same age group? The three options recorded for D1
# — separate labelled ladders, a note, or a tab within the age group — cannot be
# chosen without knowing whether the second competition is a separate PlayHQ
# competition with its own season, extra grades inside one season, or a
# short-form series for which a ladder is the wrong thing to show at all.
#
# Defaults to SEJ 2026 U10, which is the case in OUTSTANDING_TASKS.md D1 and the
# one producing roster conflicts in the results log.
#
# Roughly 3 + one call per grade in the age group. A dozen calls for the default.

name: Probe concurrent competitions

on:
  workflow_dispatch:
    inputs:
      org:
        description: '8-character organisation code. Default 1cf85e52 (SEJ).'
        required: false
        default: '1cf85e52'
        type: string
      season:
        description: 'Season id. Default 4dfaaab5 (SEJ 2026).'
        required: false
        default: '4dfaaab5'
        type: string
      age:
        description: 'Age to focus on, e.g. U10. Leave empty for every age.'
        required: false
        default: 'U10'
        type: string

permissions:
  contents: read

concurrency:
  group: probe-concurrent-comps
  cancel-in-progress: false

jobs:
  probe:
    name: How are two competitions represented
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check scripts/probe-concurrent-comps.js

      - name: Run probe
        env:
          PROBE_ORG: ${{ github.event.inputs.org }}
          PROBE_SEASON: ${{ github.event.inputs.season }}
          PROBE_AGE: ${{ github.event.inputs.age }}
        run: node scripts/probe-concurrent-comps.js
